(function(){
var C=window.DG_CONFIG; var ans=new Array(C.q.length).fill(null); var i=0;
var $=function(s){return document.querySelector(s)};
function show(id){['s-intro','s-quiz','s-result'].forEach(function(x){document.getElementById(x).hidden=(x!==id);});window.scrollTo({top:0,behavior:'smooth'});}
function render(){
  var q=C.q[i];$('#qn').textContent=(i+1)+' / '+C.q.length;$('#qt').textContent=q.t;$('#qdim').textContent=C.dims[q.d].name;
  $('.prog i').style.width=(i/C.q.length*100)+'%';
  var lk=$('#lik');lk.innerHTML='';C.scale.forEach(function(lab,v){var b=document.createElement('button');b.innerHTML='<b>'+(v+1)+'</b>'+lab;if(ans[i]===v+1)b.classList.add('sel');b.onclick=function(){ans[i]=v+1;lk.querySelectorAll('button').forEach(function(x){x.classList.remove('sel')});b.classList.add('sel');setTimeout(next,220);};lk.appendChild(b);});
  $('#prev').style.visibility=i>0?'visible':'hidden';
}
function next(){if(ans[i]==null)return;if(i<C.q.length-1){i++;render();}else{result();}}
function prev(){if(i>0){i--;render();}}
function result(){
  var dims=C.dims.map(function(d,di){var qs=C.q.map(function(q,qi){return q.d===di?(q.r?6-ans[qi]:ans[qi]):null}).filter(function(x){return x!=null});var avg=qs.reduce(function(a,b){return a+b},0)/qs.length;return {name:d.name,key:d.key,score:Math.round((avg-1)/4*100),avg:avg};});
  var v=C.verdict(dims);
  show('s-result');
  var big=$('#rs-big');big.textContent=v.big||'';big.style.color=v.color||'#3684FF';
  $('#rs-title').textContent=v.title;$('#rs-sub').textContent=v.sub||'';
  var sc=$('#rs-score');if(v.score!=null){sc.textContent=v.scoreLabel||('지수 '+v.score);sc.hidden=false;}else sc.hidden=true;
  var bars=$('#bars');bars.innerHTML='';var top=Math.max.apply(null,dims.map(function(d){return d.score}));var low=Math.min.apply(null,dims.map(function(d){return d.score}));
  dims.forEach(function(d){var cls=d.score===top?' top':(d.score===low?' weak':'');bars.innerHTML+='<div class="bar'+cls+'"><span class="n">'+d.name+'</span><span class="tr"><i data-w="'+d.score+'"></i></span><span class="v">'+d.score+'</span></div>';});
  setTimeout(function(){bars.querySelectorAll('i').forEach(function(x){x.style.width=x.getAttribute('data-w')+'%'})},80);
  $('#rs-interp').textContent=v.interp;$('#rs-next').innerHTML=v.next;
  if(C.afterResult)C.afterResult(v,dims);
}

$('#prev').onclick=prev;$('#retry').onclick=function(){show('s-intro');};
})();
