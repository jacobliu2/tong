<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>코리아 기업실무센터 v0.2</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 코리아 인증센터 v0.2 — 디자인 시스템 (지시서 54~59)
   원칙: 여백 중심, 얕은 그림자, 낮은 중첩, 텍스트 상태 병기 */
:root{
 --blue:#3182F6; --blue-weak:#EAF2FE;
 --bg:#F7F8FA; --surface:#FFFFFF;
 --text:#191F28; --text2:#6B7684; --text3:#8B95A1;
 --divider:#E5E8EB;
 --pos:#20C997; --pos-weak:#E6F9F1;
 --info:#3182F6; --info-weak:#EAF2FE;
 --warn:#F59F00; --warn-weak:#FDF4E1;
 --danger:#F04452; --danger-weak:#FDECEE;
 --neutral:#8B95A1; --neutral-weak:#F2F4F6;
 --navy:#283F55; /* 브랜드 보조색: 제한 사용 */
 --r-major:20px; --r-card:16px; --r-btn:12px; --r-input:12px;
 --shadow-soft:0 1px 2px rgba(25,31,40,.05);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:"Pretendard Variable",Pretendard,-apple-system,"Noto Sans KR",sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--text)}
a{color:inherit;text-decoration:none}
::placeholder{color:var(--text3)}
.ic{vertical-align:-3px;flex:none}

/* ── 레이아웃 ── */
.app{display:flex;min-height:100vh}
.side{width:228px;flex:0 0 228px;background:var(--surface);border-right:1px solid var(--divider);padding:20px 12px 16px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 20px}
.brand .mark{width:32px;height:32px;border-radius:9px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.brand b{font-size:15.5px;font-weight:700;letter-spacing:-.2px;display:block;line-height:1.25}
.brand small{font-size:11px;color:var(--text3);font-weight:500}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;font-weight:600;color:var(--text2);font-size:14.5px}
.nav-item:hover{background:var(--neutral-weak)}
.nav-item.on{background:var(--blue-weak);color:var(--blue);font-weight:700}
.nav-gap{height:14px;border-bottom:1px solid var(--divider);margin:0 8px 14px}
.nav-bottom{margin-top:auto}
.mode-note{font-size:11.5px;color:var(--text3);padding:12px 12px 0;line-height:1.5}
.main{flex:1;min-width:0}
.topbar{height:58px;background:rgba(255,255,255,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--divider);display:flex;align-items:center;gap:14px;padding:0 24px;position:sticky;top:0;z-index:40}
.crumb{font-size:14px;color:var(--text2);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-search{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--neutral-weak);border-radius:999px;padding:7px 14px;color:var(--text3);min-width:220px}
.top-search input{border:none;background:none;outline:none;width:100%;font-size:14px}
.who-btn{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:var(--neutral-weak);font-weight:700;font-size:13.5px;white-space:nowrap}
.who-btn small{font-size:11.5px;color:var(--text2);font-weight:500}
.who-wrap{position:relative}
.who-pop{position:absolute;right:0;top:44px;background:var(--surface);border:1px solid var(--divider);border-radius:14px;box-shadow:0 8px 28px rgba(25,31,40,.1);min-width:210px;padding:6px;display:none;z-index:60}
.who-pop.open{display:block}
.who-pop button{display:flex;width:100%;text-align:left;padding:9px 12px;border-radius:8px;font-size:14px;font-weight:600;gap:8px;align-items:center}
.who-pop button:hover{background:var(--neutral-weak)}
.content{padding:28px 32px 64px;max-width:1180px;width:100%;margin:0 auto}
.menu-btn{display:none;padding:6px 8px;border-radius:8px}

/* ── 타이포 (지시서 59) ── */
.page-title{font-size:29px;font-weight:800;letter-spacing:-.5px;line-height:1.3}
.page-sub{color:var(--text2);font-size:15px;margin-top:4px;margin-bottom:24px}
.hero-line{font-size:25px;font-weight:700;letter-spacing:-.4px;line-height:1.4}
.hero-line em{font-style:normal;color:var(--blue)}
.sec-title{font-size:19px;font-weight:700;letter-spacing:-.3px;margin:30px 0 12px;display:flex;align-items:center;gap:8px}
.sec-title:first-child{margin-top:0}
.sec-title .hint{font-size:12.5px;color:var(--text3);font-weight:500;margin-left:auto}
.muted{color:var(--text2)} .small{font-size:13.5px} .xs{font-size:12.5px;color:var(--text3)}
.row{display:flex;align-items:center;gap:10px} .wrap{flex-wrap:wrap}
.sp{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}

/* ── 카드: 테두리 위주, 그림자 최소 (지시서 57) ── */
.card{background:var(--surface);border:1px solid var(--divider);border-radius:var(--r-card);padding:20px 22px}
.card.major{border-radius:var(--r-major);padding:24px 26px}
.card.flat{box-shadow:none}
.card+.card{margin-top:12px}
.list-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 2px;border-bottom:1px solid var(--divider)}
.list-row:last-child{border-bottom:none}
.list-row.click{cursor:pointer;margin:0 -10px;padding:14px 10px;border-radius:10px}
.list-row.click:hover{background:#FAFBFC}

/* ── 버튼 ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:700;font-size:14.5px;border-radius:var(--r-btn);padding:10px 18px;white-space:nowrap;transition:filter .12s}
.btn:hover{filter:brightness(.96)}
.btn-pri{background:var(--blue);color:#fff}
.btn-sec{background:var(--neutral-weak);color:var(--text)}
.btn-line{background:var(--surface);border:1px solid var(--divider)}
.btn-danger{background:var(--danger-weak);color:var(--danger)}
.btn-txt{color:var(--text2);padding:8px 10px;border-radius:9px}
.btn-txt:hover{background:var(--neutral-weak)}
.btn-sm{padding:7px 13px;font-size:13.5px;border-radius:10px}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* ── 칩·상태 ── */
.chip{display:inline-flex;align-items:center;gap:5px;font-weight:700;font-size:12.5px;border-radius:999px;padding:3px 10px}
.chip-pos{background:var(--pos-weak);color:#0CA678}
.chip-info{background:var(--info-weak);color:var(--blue)}
.chip-warn{background:var(--warn-weak);color:#D98700}
.chip-danger{background:var(--danger-weak);color:var(--danger)}
.chip-neutral{background:var(--neutral-weak);color:var(--text2)}
.sum-mark{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:8px;font-size:12.5px;font-weight:800}
.sum-A{background:var(--pos-weak);color:#0CA678}.sum-B{background:var(--info-weak);color:var(--blue)}
.sum-C{background:var(--warn-weak);color:#D98700}.sum-D{background:var(--neutral-weak);color:var(--text2)}
.sum-E{background:var(--danger-weak);color:var(--danger)}
.tag{font-size:11.5px;color:var(--text3);background:var(--neutral-weak);border-radius:6px;padding:1px 7px;font-weight:600}
.tag.draft{color:#D98700;background:var(--warn-weak)}

/* ── 홈 액션 리스트 ── */
.act-line{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid var(--divider);font-weight:600;font-size:15px;cursor:pointer}
.act-line:last-child{border-bottom:none}
.act-line .n{margin-left:auto;font-weight:800;color:var(--blue)}
.act-line:hover{color:var(--blue)}

/* ── 기회 카드 ── */
.opp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.opp-card{border:1px solid var(--divider);border-radius:var(--r-card);padding:16px 18px;background:var(--surface);display:flex;flex-direction:column;gap:8px}
.opp-card .co{font-weight:700;font-size:15.5px}
.opp-card .lead{font-size:14.5px;color:var(--text2)}

/* ── 테이블 ── */
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-size:12.5px;color:var(--text3);font-weight:600;text-align:left;padding:9px 10px;border-bottom:1px solid var(--divider);white-space:nowrap}
.tbl td{padding:12px 10px;border-bottom:1px solid var(--divider);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr.click:hover td{background:#FAFBFC;cursor:pointer}

/* ── 검색 ── */
.search-line{display:flex;gap:10px;margin-bottom:18px}
.search-line input{flex:1;border:1px solid var(--divider);border-radius:var(--r-input);padding:11px 14px;background:var(--surface)}
.search-line input:focus{outline:2px solid var(--blue);outline-offset:-1px;border-color:transparent}

/* ── 기업 상세: 흰 배경 헤더 (지시서 21) ── */
.co-head{padding:6px 2px 20px}
.co-head h2{font-size:27px;font-weight:800;letter-spacing:-.4px}
.co-head .meta{color:var(--text2);font-size:14.5px;margin-top:5px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--divider);margin-bottom:20px;overflow-x:auto}
.tab{padding:10px 14px;font-weight:600;font-size:14.5px;color:var(--text2);border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--text);border-bottom-color:var(--text);font-weight:700}
.key3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.key3 .k-card{border:1px solid var(--divider);border-radius:var(--r-card);padding:16px 18px;background:var(--surface)}
.key3 .k-t{font-size:12.5px;color:var(--text3);font-weight:600;margin-bottom:6px}
.key3 .k-v{font-size:15.5px;font-weight:700;line-height:1.45}
.key3 .k-v .accent{color:var(--blue)}

/* ── 인증 카드 (지시서 23) ── */
.cert-card{border:1px solid var(--divider);border-radius:var(--r-card);padding:17px 19px;background:var(--surface);cursor:pointer}
.cert-card:hover{border-color:#CBD3DB}
.cert-card .head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.cert-card .nm{font-weight:700;font-size:16px}
.axis-line{display:flex;gap:22px;margin-top:11px;flex-wrap:wrap}
.axis-line .ax .k{font-size:12px;color:var(--text3);font-weight:600;margin-bottom:3px}
.map-group{margin-bottom:26px}
.map-group h3{font-size:15px;font-weight:700;color:var(--text2);margin-bottom:10px;display:flex;gap:8px;align-items:center}
.map-group .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.rel-note{font-size:13.5px;color:var(--text2);background:var(--neutral-weak);border-radius:10px;padding:9px 13px;margin-top:10px}

/* ── 상세 패널 공통 ── */
.gap-item{border-left:3px solid var(--warn);background:#FFFDF6;border-radius:0 10px 10px 0;padding:11px 14px;margin-bottom:9px}
.gap-item.fail{border-left-color:var(--danger);background:#FFF9FA}
.gap-item .t{font-weight:700;font-size:14.5px}
.gap-item .d{font-size:13.5px;color:var(--text2);margin-top:3px}
.note-box{border:1px dashed #CBD3DB;border-radius:12px;padding:12px 15px;background:#FAFBFC;font-size:13.5px;color:var(--text2)}
.warn-box{background:var(--danger-weak);border-radius:10px;padding:12px 15px;font-size:14px;color:#C2313D;font-weight:600}
.count-line{display:flex;gap:16px;flex-wrap:wrap;font-size:13.5px;color:var(--text2);font-weight:600}
.count-line b{color:var(--text)}

/* ── 위저드 ── */
.wiz-prog{display:flex;align-items:center;margin-bottom:22px;flex-wrap:wrap}
.wiz-step{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--text3)}
.wiz-step .dot{width:24px;height:24px;border-radius:999px;background:var(--neutral-weak);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.wiz-step.done .dot{background:var(--pos-weak);color:#0CA678}
.wiz-step.cur{color:var(--text)}.wiz-step.cur .dot{background:var(--text);color:#fff}
.wiz-bar{flex:1;height:2px;background:var(--divider);margin:0 8px;min-width:14px}
.wiz-bar.done{background:var(--pos)}
.q{margin-bottom:18px}
.q .q-t{display:block;font-weight:700;font-size:15px;margin-bottom:7px}
.q .q-h{font-size:12.5px;color:var(--text3);margin:-3px 0 8px}
.q input[type=text],.q input[type=number],.q input[type=date],.q select{width:100%;max-width:420px;border:1px solid var(--divider);border-radius:var(--r-input);padding:11px 13px;background:var(--surface)}
.q input:focus,.q select:focus,textarea:focus{outline:2px solid var(--blue);outline-offset:-1px;border-color:transparent}
.choice{display:flex;gap:8px;flex-wrap:wrap}
.choice button{border:1px solid var(--divider);background:var(--surface);border-radius:var(--r-input);padding:10px 17px;font-weight:600;font-size:14.5px;color:var(--text2)}
.choice button.on{border-color:var(--blue);background:var(--blue-weak);color:var(--blue);font-weight:700}
.wiz-foot{display:flex;justify-content:space-between;margin-top:24px;gap:10px}

/* ── 진행바 ── */
.pbar{height:7px;border-radius:999px;background:var(--neutral-weak);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--blue);border-radius:999px}

/* ── 타임라인·브리핑 ── */
.rm-line{display:flex;gap:14px;padding:9px 0}
.rm-line .mo{flex:0 0 74px;font-weight:700;font-size:13.5px;color:var(--text2)}
.rm-line .bd{flex:1;border-left:2px solid var(--divider);padding-left:14px;padding-bottom:4px}
.bf-sec{margin-bottom:20px}
.bf-sec h4{font-size:13px;font-weight:700;color:var(--text3);margin-bottom:8px}
.q-line{padding:10px 14px;background:var(--neutral-weak);border-radius:10px;font-size:14.5px;font-weight:600;margin-bottom:7px}
.q-line.hl{background:var(--blue-weak);color:var(--navy);font-weight:700}

/* ── 프로젝트 ── */
.task-row{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--divider)}
.task-row:last-child{border-bottom:none}
.task-row .nm{font-weight:600;font-size:14.5px;flex:1}
.task-row.done .nm{color:var(--text3);text-decoration:line-through}
.task-row select{border:1px solid var(--divider);border-radius:9px;padding:5px 8px;font-size:13px;background:var(--surface)}
.doc-slot{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px dashed var(--divider);border-radius:12px;padding:11px 14px;margin-bottom:8px;font-size:14px;font-weight:600}

/* ── 모달·드로어·토스트 ── */
.modal-bg{position:fixed;inset:0;background:rgba(25,31,40,.42);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal-bg.open{display:flex}
.modal{background:var(--surface);border-radius:var(--r-major);padding:24px;max-width:540px;width:100%;max-height:88vh;overflow:auto}
.modal h3{font-size:18px;font-weight:700;margin-bottom:14px}
.modal textarea{width:100%;border:1px solid var(--divider);border-radius:var(--r-input);padding:11px 13px;min-height:78px;resize:vertical}
#toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:#26303B;color:#fff;padding:11px 20px;border-radius:999px;font-weight:600;font-size:14px;opacity:0;transition:opacity .2s;z-index:200;pointer-events:none;max-width:88vw}
#toast.show{opacity:1}
.empty{text-align:center;padding:44px 20px;color:var(--text2)}
.empty .big{font-size:16px;font-weight:700;color:var(--text);margin-bottom:6px}

/* ── 관리자 ── */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.form-grid .q{margin-bottom:0}
.form-grid .full{grid-column:1/-1}
.admin-stat{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-bottom:8px}
.admin-stat .as{border:1px solid var(--divider);border-radius:var(--r-card);padding:14px 16px;background:var(--surface)}
.admin-stat .as .k{font-size:12.5px;color:var(--text3);font-weight:600}
.admin-stat .as .v{font-size:23px;font-weight:800;margin-top:3px}

@media print{.side,.topbar,.no-print{display:none!important}.content{padding:0;max-width:none}.card{border-color:#ddd}}
@media (max-width:1000px){
 .side{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);transition:transform .18s;z-index:80}
 .side.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.16)}
 .menu-btn{display:inline-flex}
 .content{padding:20px 16px 56px}
 .key3,.grid2,.grid3,.form-grid{grid-template-columns:1fr}
 .top-search{display:none}
}

/* ── scale 질문 (이노비즈·메인비즈 5단계) ── */
.scale{display:flex;flex-direction:column;gap:8px}
.scale-opt{display:flex;align-items:center;gap:10px;text-align:left;padding:12px 14px;border:1.5px solid var(--divider);border-radius:12px;font-size:14px;font-weight:600;color:var(--text2);background:var(--surface);transition:all .12s;width:100%}
.scale-opt b{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:7px;background:var(--neutral-weak);color:var(--text2);font-size:13px;font-weight:800;flex-shrink:0}
.scale-opt:hover{border-color:var(--blue-weak)}
.scale-opt.on{border-color:var(--blue);background:var(--blue-weak);color:var(--navy)}
.scale-opt.on b{background:var(--blue);color:#fff}
@media print{.side,.top,.who-btn,.btn{display:none!important}.main{padding:0!important}.card{break-inside:avoid}}

.cur-co{display:flex;flex-direction:column;align-items:flex-start;gap:0;padding:5px 14px;border-radius:12px;background:var(--blue-weak);margin-left:14px;line-height:1.25;max-width:230px;overflow:hidden}
.cur-co b{font-size:13.5px;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.cur-co small{font-size:11px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
@media(max-width:720px){.cur-co{display:none}}

/* ═══════════════ KBMC 브랜드 스킨 — 화이트 앤 네이비 글라스모피즘 ═══════════════ */
:root{ --navy:#283F55; --navy-2:#1B2C3D; --navy-3:#33506E;

body{ background:
  radial-gradient(60vw 50vh at 12% -5%, rgba(51,80,110,.16), transparent 60%),
  radial-gradient(50vw 50vh at 105% 8%, rgba(40,63,85,.14), transparent 55%),
  linear-gradient(160deg,#F3F7FC 0%,#E7EEF7 52%,#DCE5F1 100%);
  background-attachment:fixed; }

/* 사이드바 — 네이비 글라스 */
.side{ background:linear-gradient(180deg,rgba(40,63,85,.95),rgba(27,44,61,.93));
 -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
 border-right:1px solid rgba(255,255,255,.10);box-shadow:2px 0 24px rgba(27,44,61,.12);color:#fff}
.brand{align-items:center;padding:6px 8px 22px}
.brand .mark{width:42px;height:42px;border-radius:12px;background:#fff var(--brand-mark) center/25px 22px no-repeat;
 font-size:0;box-shadow:0 3px 10px rgba(0,0,0,.22);flex:0 0 42px}
.brand b{color:#fff}
.brand small{color:rgba(255,255,255,.55)}
.nav-item{color:rgba(255,255,255,.74)}
.nav-item .ic{opacity:.85}
.nav-item:hover{background:rgba(255,255,255,.10);color:#fff}
.nav-item.on{background:rgba(255,255,255,.16);color:#fff;font-weight:700;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.nav-item.on .ic{opacity:1}
.nav-gap{border-top:1px solid rgba(255,255,255,.12);margin:10px 6px}
.mode-note{color:rgba(255,255,255,.5)}

/* 상단바 — 화이트 글라스 */
.topbar{background:rgba(255,255,255,.66);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
 border-bottom:1px solid rgba(255,255,255,.6);box-shadow:0 2px 20px rgba(27,44,61,.05)}
.crumb{color:var(--navy);font-weight:700}
.cur-co{background:rgba(40,63,85,.08);border:1px solid rgba(40,63,85,.10)}
.top-search{background:rgba(255,255,255,.7);border:1px solid rgba(40,63,85,.08)}
.who-btn{background:rgba(40,63,85,.08);color:var(--navy)}

/* 카드 — 화이트 글라스 */
.card{background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
 border:1px solid var(--glass-brd);border-radius:var(--r-card);box-shadow:var(--glass-sh)}
.card.major{background:rgba(255,255,255,.74);box-shadow:0 12px 40px rgba(27,44,61,.12)}
.card.flat{background:rgba(255,255,255,.5)!important;border:1px solid rgba(255,255,255,.5)!important;box-shadow:none;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.cert-card{background:rgba(255,255,255,.62);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--glass-brd);box-shadow:0 4px 18px rgba(27,44,61,.07)}
.cert-card:hover{box-shadow:0 8px 28px rgba(27,44,61,.14);transform:translateY(-1px);transition:all .15s}

/* 주요 버튼 — 네이비 */
.btn-pri{background:linear-gradient(135deg,var(--navy-3),var(--navy));color:#fff;box-shadow:0 4px 14px rgba(40,63,85,.28)}
.btn-pri:hover{filter:brightness(1.08)}
.btn-line{background:rgba(255,255,255,.5);border:1px solid rgba(40,63,85,.18);color:var(--navy)}
.btn-sec{background:rgba(40,63,85,.06);color:var(--navy)}

/* 강조·상태 — 네이비 계열로 통일 (기능색 chip은 유지) */
.hero-line em{color:var(--navy)}
.sec-title{color:var(--navy)}
.note-box{background:rgba(40,63,85,.06);border:1px solid rgba(40,63,85,.12);color:var(--navy)}
.chip-info{background:rgba(40,63,85,.10);color:var(--navy)}
.q-line.hl,.scale-opt.on{background:rgba(40,63,85,.08);color:var(--navy);border-color:var(--navy-3)}

/* 읽기 밀도 높은 표 — 유리 대신 불투명 흰 배경으로 가독성 확보 */
.tbl{background:var(--glass-solid);border-radius:12px;overflow:hidden}
.tbl th{background:rgba(40,63,85,.06);color:var(--navy)}

/* 모달·팝업·토스트 글라스 */
.modal{background:rgba(255,255,255,.9);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:1px solid var(--glass-brd)}
.modal-bg{background:rgba(27,44,61,.34);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.who-pop{background:rgba(255,255,255,.9);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--glass-brd)}
#toast{background:rgba(27,44,61,.92);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}

/* ═══════════════ 마우스오버 툴팁 ═══════════════ */
[data-tip]{position:relative}
[data-tip]:hover::after{content:attr(data-tip);position:absolute;z-index:9999;left:50%;top:calc(100% + 9px);transform:translateX(-50%);
 background:rgba(27,44,61,.96);color:#fff;font-size:12px;font-weight:600;line-height:1.45;padding:8px 11px;border-radius:9px;
 white-space:normal;width:max-content;max-width:230px;text-align:left;box-shadow:0 8px 24px rgba(27,44,61,.3);
 -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);pointer-events:none;opacity:0;animation:tipIn .12s ease forwards}
[data-tip]:hover::before{content:'';position:absolute;left:50%;top:calc(100% + 3px);transform:translateX(-50%);
 border:5px solid transparent;border-bottom-color:rgba(27,44,61,.96);z-index:9999;pointer-events:none}
@keyframes tipIn{to{opacity:1}}
/* 사이드바 항목은 오른쪽에 표시 */
.side [data-tip]:hover::after{left:calc(100% + 12px);top:50%;transform:translateY(-50%)}
.side [data-tip]:hover::before{left:100%;top:50%;transform:translateY(-50%);border-bottom-color:transparent;border-right-color:rgba(27,44,61,.96)}
/* 상단바 우측 요소는 아래+왼쪽 정렬로 화면 밖 방지 */
.topbar .who-wrap [data-tip]:hover::after,.top-search[data-tip]:hover::after{left:auto;right:0;transform:none}
.topbar .who-wrap [data-tip]:hover::before{left:auto;right:14px;transform:none}
/* 터치 기기에서는 숨김 */
@media(hover:none){[data-tip]:hover::after,[data-tip]:hover::before{display:none}}
@media print{[data-tip]:hover::after,[data-tip]:hover::before{display:none!important}}

/* ═══════════════ KSIC 조회·활용 매뉴얼 ═══════════════ */
.ksic-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:6px}
.ksic-card{display:flex;flex-direction:column;gap:5px;text-align:left;padding:15px 16px;background:rgba(255,255,255,.62);
 -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--glass-brd);border-radius:14px;box-shadow:0 4px 16px rgba(27,44,61,.06);transition:all .15s}
.ksic-card:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(27,44,61,.14)}
.kc-code{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--navy-3),var(--navy));color:#fff;font-weight:800;font-size:15px}
.kc-name{font-weight:700;font-size:14.5px;color:var(--text);line-height:1.3}
.kc-mid{font-size:12px;color:var(--text3)}
.kc-progs{display:flex;gap:4px;flex-wrap:wrap;margin-top:2px}
.mini-chip{font-size:10.5px;font-weight:700;color:var(--navy);background:rgba(40,63,85,.09);border-radius:5px;padding:1px 6px;font-style:normal}
.ksic-badge{display:flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,var(--navy-3),var(--navy));color:#fff;font-weight:800;font-size:24px;flex:0 0 52px}
.ksic-mid{padding:12px 0;border-bottom:1px solid rgba(40,63,85,.08)}
.ksic-mid:last-child{border-bottom:none}
.km-head{font-size:14.5px;color:var(--text);margin-bottom:6px}
.km-head b{color:var(--navy)}
.km-ex{display:flex;flex-wrap:wrap;gap:6px}
.km-tag{font-size:12.5px;color:var(--text2);background:rgba(255,255,255,.55);border:1px solid rgba(40,63,85,.1);border-radius:7px;padding:3px 9px}
.manual-flow{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}
.manual-flow .mf{display:flex;align-items:center;gap:8px;background:rgba(40,63,85,.06);border-radius:10px;padding:9px 14px;font-weight:700;color:var(--navy);font-size:14px}
.manual-flow .mf span{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--navy);color:#fff;font-size:12px}
.manual-li{position:relative;padding:5px 0 5px 16px;font-size:14.5px;color:var(--text2);line-height:1.55}
.manual-li::before{content:'';position:absolute;left:2px;top:12px;width:5px;height:5px;border-radius:50%;background:var(--navy-3)}

/* ── KSIC 5단계·드롭다운 추가 ── */
.ksic-levels{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:0 0 16px;color:var(--text3);font-size:12.5px}
.ksic-levels .lv{background:rgba(40,63,85,.06);border-radius:7px;padding:3px 9px;font-weight:600;color:var(--navy)}
.ksic-levels svg{opacity:.4}
.ksic-crumb{font-size:13px;color:var(--text3)}
.ksic-crumb b{color:var(--navy)}
.ksic-crumb span{margin:0 4px;color:var(--text3)}
.ksic-sub{padding:11px 0;border-bottom:1px solid rgba(40,63,85,.08)}
.ksic-sub:last-child{border-bottom:none}
.ks-head{font-size:14.5px;color:var(--text);margin-bottom:6px}
.ks-head b{color:var(--navy);font-variant-numeric:tabular-nums}
.km-tag i{font-style:normal;color:var(--navy);font-weight:800;font-variant-numeric:tabular-nums;margin-right:3px;font-size:11.5px}
.ksic-select{display:flex;flex-direction:column;gap:8px}
.ksic-select select{width:100%}
.ksic-picked{font-size:13px;color:var(--navy);background:rgba(40,63,85,.06);border-radius:8px;padding:7px 11px}
.ksic-picked b{font-variant-numeric:tabular-nums}

/* ── KSIC 총설·정의 ── */
.ksic-intro{margin:0 0 14px;background:rgba(255,255,255,.6);border:1px solid var(--glass-brd);border-radius:12px;overflow:hidden}
.ksic-intro summary{cursor:pointer;padding:12px 16px;font-weight:700;color:var(--navy);font-size:14px;list-style:none}
.ksic-intro summary::-webkit-details-marker{display:none}
.ksic-intro summary::before{content:'＋';margin-right:8px;color:var(--navy-3)}
.ksic-intro[open] summary::before{content:'－'}
.ksic-intro .ki-body{padding:0 16px 14px;font-size:14px;color:var(--text2);line-height:1.6}
.ksic-intro .ki-body p{margin:8px 0}
.ksic-intro .ki-body b{color:var(--navy)}
.ksic-def{margin:12px 0 0;font-size:14.5px;color:var(--text2);line-height:1.6;padding:12px 14px;background:rgba(255,255,255,.5);border-radius:10px;border:1px solid rgba(40,63,85,.08)}

/* ── KSIC 세분류 레벨 ── */
.ksic-se{margin:6px 0 6px 12px;padding-left:12px;border-left:2px solid rgba(40,63,85,.1)}
.kse-head{font-size:13px;color:var(--text2);margin-bottom:5px}
.kse-head b{color:var(--navy);font-variant-numeric:tabular-nums}
.km-tag.click{cursor:pointer;transition:all .12s}
.km-tag.click:hover{border-color:var(--navy);background:rgba(40,63,85,.06)}

/* ═══════════════ 진단보고서 ═══════════════ */
.report-actions{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.report{max-width:820px;margin:0 auto;background:#fff;border:1px solid #e5e8ec;border-radius:12px;padding:44px 48px;color:#1a2733;box-shadow:0 6px 24px rgba(27,44,61,.08)}
.rp-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid var(--navy);padding-bottom:14px;margin-bottom:22px}
.rp-logo{width:120px !important;height:56px !important;margin:0 !important;background-position:left center !important}
.rp-meta{font-size:11.5px;color:#5b6b7a;text-align:right;line-height:1.7}
.rp-title{font-size:24px;font-weight:800;color:var(--navy);text-align:center;margin:8px 0 24px;letter-spacing:-.3px}
.rp-info{width:100%;border-collapse:collapse;font-size:13px}
.rp-info th,.rp-info td{border:1px solid #dde2e7;padding:9px 12px;text-align:left}
.rp-info th{background:#f4f6f8;color:var(--navy);font-weight:700;width:110px;white-space:nowrap}
.rp-sec{margin-top:28px}
.rp-sec h2{font-size:16px;font-weight:800;color:var(--navy);border-left:4px solid var(--navy);padding-left:10px;margin:0 0 14px}
.rp-table{width:100%;border-collapse:collapse;font-size:12.5px}
.rp-table th,.rp-table td{border:1px solid #dde2e7;padding:8px 10px;text-align:left}
.rp-table thead th{background:var(--navy);color:#fff;font-weight:700}
.rp-table tbody tr:nth-child(even){background:#f8fafb}
.rp-note{font-size:11.5px;color:#6b7a88;margin-top:10px;line-height:1.6}
.rp-prog{border:1px solid #e5e8ec;border-radius:8px;padding:14px 16px;margin-bottom:12px}
.rp-prog-h{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--navy)}
.rp-prog-h span{font-size:12px;color:#5b6b7a;font-weight:600}
.rp-track{font-size:12px;color:#5b6b7a;margin:4px 0 8px}
.rp-gap{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
.rp-gap th,.rp-gap td{border:1px solid #e5e8ec;padding:6px 9px;text-align:left;vertical-align:top}
.rp-gap thead th{background:#f4f6f8;color:var(--navy);font-weight:700}
.rp-gap .gap-fail td:first-child{border-left:3px solid #d9534f}
.rp-gap .gap-unk td:first-child{border-left:3px solid #e0a800}
.rp-draft{font-size:10px;color:#8a97a3;font-weight:600}
.rp-ok{font-size:12.5px;color:#3a7d44;padding:8px 0}
.rp-docs{margin-bottom:12px}
.rp-docs b{color:var(--navy);font-size:13px}
.rp-docs ul{margin:6px 0 0;padding-left:20px}
.rp-docs li{font-size:12.5px;color:#33404d;padding:2px 0}
.rp-empty{padding:40px;text-align:center;color:#6b7a88}
.rp-foot{margin-top:34px;padding-top:14px;border-top:1px solid #e5e8ec;display:flex;justify-content:space-between;font-size:10.5px;color:#8a97a3}
@media print{
 .report-actions,.side,.topbar,.top,.who-btn{display:none!important}
 .report{border:none;box-shadow:none;max-width:none;margin:0;padding:0;border-radius:0}
 .content,.main{padding:0!important;max-width:none!important}
 .rp-sec{break-inside:avoid}.rp-prog{break-inside:avoid}
 .rp-table thead th,.rp-info th{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

/* ── 서류 준비 체크리스트 ── */
.doc-check{margin-top:4px}
.dc-bar{height:7px;background:rgba(40,63,85,.1);border-radius:4px;overflow:hidden}
.dc-fill{height:100%;background:linear-gradient(90deg,var(--navy-3),var(--navy));border-radius:4px;transition:width .3s}
.dc-sum{font-size:12px;color:var(--text3);margin:6px 0 10px;font-weight:600}
.dc-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 10px;border:1px solid rgba(40,63,85,.09);border-radius:9px;margin-bottom:6px;background:rgba(255,255,255,.5)}
.dc-row.dc-na{opacity:.55}
.dc-name{font-size:13.5px;color:var(--text);flex:1}
.dc-btns{display:flex;gap:4px;flex:0 0 auto}
.dc-b{font-size:11.5px;font-weight:600;padding:4px 9px;border:1px solid rgba(40,63,85,.15);background:#fff;border-radius:7px;cursor:pointer;color:var(--text3);transition:all .12s}
.dc-b:hover{border-color:var(--navy-3)}
.dc-b.on{color:#fff;border-color:transparent}
.dc-b.on.tone-pos{background:#3a7d44}
.dc-b.on.tone-warn{background:#c9821b}
.dc-b.on.tone-neutral{background:#6b7a88}
/* 보고서 서류표 */
.rp-doctbl{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:5px}
.rp-doctbl td{border:1px solid #e5e8ec;padding:6px 10px}
.rp-doctbl td:last-child{width:80px;text-align:center;font-weight:700}
.rp-dc-RECEIVED{color:#3a7d44}.rp-dc-MISSING{color:#c9821b}.rp-dc-NA{color:#8a97a3}.rp-dc-none{color:#b0bac3}

/* ── 보유 인증·갱신 관리 ── */
.cert-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid rgba(40,63,85,.08)}
.cert-row:first-child{padding-top:0}
.cr-main b{font-size:14.5px;color:var(--text)}
.cr-status{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.cert-add{display:flex;gap:8px;align-items:center;margin-top:14px;flex-wrap:wrap}
.cert-add select,.cert-add input{padding:8px 10px;border:1px solid rgba(40,63,85,.18);border-radius:8px;font-size:13px;font-family:inherit;background:#fff}
.cert-add select{flex:1;min-width:180px}
.renew-alert{background:linear-gradient(180deg,rgba(201,130,27,.09),rgba(201,130,27,.04));border:1px solid rgba(201,130,27,.28);border-radius:14px;padding:14px 16px;margin-bottom:22px}
.ra-head{display:flex;align-items:center;gap:8px;font-weight:800;color:#b06f12;font-size:14.5px;margin-bottom:8px}
.ra-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;cursor:pointer;font-size:13.5px;border-top:1px solid rgba(201,130,27,.15)}
.ra-row:hover{opacity:.82}
@media print{.renew-alert{display:none}}

/* ── 실행계획(단계·기간) ── */
.plan-phase{border:1px solid rgba(40,63,85,.1);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:rgba(255,255,255,.5)}
.pp-h{display:flex;flex-direction:column;gap:2px;margin-bottom:8px}
.pp-h b{color:var(--navy);font-size:14px}
.pp-task{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:7px 0;border-top:1px dashed rgba(40,63,85,.12)}
.pt-main{font-size:13.5px;color:var(--text);flex:1}
.pt-meta{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex:0 0 auto;text-align:right;max-width:52%}
.pt-dur{font-size:12px;font-weight:700;color:var(--navy);background:rgba(40,63,85,.08);border-radius:6px;padding:2px 8px}
/* 보고서 phase */
.rp-phase{margin-bottom:16px}
.rp-phase-h{font-size:13.5px;font-weight:700;color:var(--navy);margin-bottom:6px;display:flex;flex-direction:column;gap:1px}
.rp-phase-h span{font-size:11.5px;font-weight:400;color:#6b7a88}

/* ── 접근성 ── */
.skip-link{position:absolute;left:-999px;top:0;z-index:9999;background:var(--navy);color:#fff;padding:10px 16px;border-radius:0 0 8px 0;font-weight:700;font-size:14px}
.skip-link:focus{left:0}
:focus-visible{outline:3px solid #4a90d9;outline-offset:2px;border-radius:6px}
[role="button"]:focus-visible,.click:focus-visible{outline:3px solid #4a90d9;outline-offset:2px}
@media print{.skip-link{display:none}}

/* ═══════════════ 재무진단 센터 ═══════════════ */
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:1100px){.grid4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.grid4{grid-template-columns:1fr}}
.fin-mode{display:inline-flex;gap:4px;margin-top:4px}
.fm-b{font-size:13px;font-weight:600;padding:8px 14px;border:1px solid rgba(40,63,85,.18);background:#fff;border-radius:8px;cursor:pointer;color:var(--text3)}
.fm-b.on{background:linear-gradient(135deg,var(--navy-3),var(--navy));color:#fff;border-color:transparent}
.fin-ind{padding:9px 12px;border:1px solid rgba(40,63,85,.18);border-radius:8px;font-size:13px;font-family:inherit;background:#fff;min-width:220px;margin-top:4px}
.fin-years{display:flex;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.fin-years label{font-size:12px;color:var(--text3);font-weight:600;display:flex;flex-direction:column;gap:4px}
.fin-years input{width:100px;padding:7px 9px;border:1px solid rgba(40,63,85,.18);border-radius:7px;font-size:13px;font-family:inherit}
.fin-grid-wrap{overflow-x:auto}
.fin-input{width:100%;border-collapse:collapse;font-size:13px;min-width:460px}
.fin-input th{background:rgba(40,63,85,.06);color:var(--navy);padding:9px 10px;text-align:center;font-weight:700;border:1px solid rgba(40,63,85,.1)}
.fin-input td{border:1px solid rgba(40,63,85,.08);padding:5px 7px}
.fi-label{background:rgba(255,255,255,.5);color:var(--text);font-weight:600;padding-left:12px !important;white-space:nowrap}
.fi-in{width:100%;padding:7px 8px;border:1px solid rgba(40,63,85,.15);border-radius:6px;text-align:right;font-size:13px;font-family:inherit}
.fi-in:focus{outline:none;border-color:var(--navy-3);box-shadow:0 0 0 3px rgba(40,63,85,.08)}
/* 등급 배너 */
.fin-grade{display:flex;gap:22px;align-items:center;border-radius:14px;padding:24px 28px;color:#fff;margin-bottom:16px;background:linear-gradient(135deg,var(--navy),var(--navy-3))}
.fin-grade.grade-A{background:linear-gradient(135deg,#0f766e,#10b981)}
.fin-grade.grade-B{background:linear-gradient(135deg,#1e3a8a,#3b82f6)}
.fin-grade.grade-C{background:linear-gradient(135deg,#b45309,#f59e0b)}
.fin-grade.grade-D{background:linear-gradient(135deg,#b91c1c,#ef4444)}
.fin-grade.grade-E{background:linear-gradient(135deg,#7f1d1d,#991b1b)}
.fg-circle{width:88px;height:88px;border-radius:50%;border:4px solid rgba(255,255,255,.5);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:2.1rem;font-weight:800;flex:0 0 88px}
.fg-circle small{font-size:.65rem;font-weight:600;opacity:.85;margin-top:2px}
.fg-title{font-size:1.2rem;font-weight:800;margin-bottom:5px}
.fg-sum{font-size:.9rem;opacity:.9;line-height:1.6}
.fg-scores{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.fgs{background:rgba(255,255,255,.12);border-radius:7px;padding:5px 10px;font-size:.7rem;text-align:center;display:flex;flex-direction:column;gap:1px}
.fgs b{font-size:1.05rem}
/* 지표 카드 */
.fin-metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(max-width:700px){.fin-metrics{grid-template-columns:1fr}}
.fin-mcard{border:1px solid rgba(40,63,85,.1);border-radius:12px;padding:14px 16px;background:rgba(255,255,255,.5)}
.fm-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;border-bottom:1px solid rgba(40,63,85,.08);padding-bottom:8px}
.fm-head b{color:var(--navy);font-size:15px}
.fm-years{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fmy{text-align:center}
.fmy-v{font-size:1.25rem;font-weight:800;color:var(--navy);margin:3px 0}
/* 정책금융 */
.fin-policy{display:flex;flex-direction:column;gap:8px}
.fp-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border:1px solid rgba(40,63,85,.1);border-radius:10px;background:rgba(255,255,255,.5)}
.fp-row.fp-ok{border-left:3px solid #3a7d44}
.fp-row.fp-no{border-left:3px solid #c9821b}
.fp-main b{font-size:14px;color:var(--text)}
.fp-crit{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.fp-c{font-size:11.5px;padding:2px 8px;border-radius:6px;background:rgba(40,63,85,.05);color:var(--text3)}
.fp-c.c-ok{background:rgba(58,125,68,.12);color:#2f6b39}
.fp-c.c-no{background:rgba(201,130,27,.12);color:#a5691a}
.fp-verdict{flex:0 0 auto}

/* 툴팁 겹침 방지: hover 요소를 쌓임 위로 */
[data-tip]:hover{z-index:9998;position:relative}
.ksic-grid,.grid3,.grid4{overflow:visible}
.ksic-card,.grid3 .card,.grid4 .card{position:relative}

<script>
/* 코리아 기업실무센터 v0.2 — 설정·상수·라벨·아이콘·유틸 */
const CONFIG={
 APP_NAME:'코리아 기업실무센터',
 MODE:'DEMO',            // 'DEMO' | 'LIVE'
 LIVE_READY:false,       // Auth·RLS 구성 전 LIVE 차단
 SUPABASE_URL:'', SUPABASE_ANON_KEY:'',
 APP_VERSION:'0.2.0'
};

/* ── 유틸 ── */
const $=(s,el)=>(el||document).querySelector(s);
const $$=(s,el)=>[...(el||document).querySelectorAll(s)];
const esc=(s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(n)=>n==null||n===''?'-':Number(n).toLocaleString('ko-KR');
const uid=()=>'id_'+Math.random().toString(36).slice(2,10)+Date.now().toString(36);
const todayStr=()=>new Date().toISOString().slice(0,10);
const nowIso=()=>new Date().toISOString();
const yearsFrom=(d)=>{if(!d)return null;const a=new Date(d),b=new Date();let y=b.getFullYear()-a.getFullYear();const m=b.getMonth()-a.getMonth();if(m<0||(m===0&&b.getDate()<a.getDate()))y--;return y;};
const daysSince=(d)=>{if(!d)return null;return Math.floor((new Date(todayStr())-new Date(d))/86400000);};
const dot=(iso)=>iso?iso.slice(0,10).replace(/-/g,'.'):'-';
const won=(억)=>억==null||억===''?'-':fmt(억)+'억원';

/* ── 센터·프로그램 ── */
const CENTERS={CERT:'인증센터',FUND:'정책자금센터',FACILITY:'사옥·시설센터'};

/* ── 판정 축 라벨 ── */
const ELIG_LABEL={ELIGIBLE:'기본요건 충족',CHECK_REQUIRED:'추가 확인 필요',NOT_ELIGIBLE:'현재 대상 아님',NOT_APPLICABLE:'해당 없음'};
const READY_LABEL={READY:'준비도 높음',NEEDS_WORK:'일부 보완 필요',EARLY_STAGE:'준비 필요',NOT_ASSESSED:'아직 평가하지 않음'};
/* 사용자 노출 상태 (지시서 16) */
const STATUS_LABEL={A:'진행 검토',B:'추가 확인',C:'준비 후 검토',D:'중장기 준비',E:'현재 대상 아님'};

function addYears(dateStr,y){ const d=new Date(dateStr); d.setFullYear(d.getFullYear()+y); d.setDate(d.getDate()-1); return d.toISOString().slice(0,10); }
function ddayTo(dateStr){ if(!dateStr)return null; return Math.ceil((new Date(dateStr)-new Date(todayStr()))/86400000); }
function renewStatus(expires){ if(!expires)return {code:'PERSIST',label:'유지형',tone:'neutral',dday:null};
 const dd=ddayTo(expires);
 if(dd<0)return {code:'EXPIRED',label:'만료됨',tone:'neg',dday:dd};
 if(dd<=RENEW_WINDOW)return {code:'DUE',label:'갱신 임박',tone:'warn',dday:dd};
 return {code:'VALID',label:'유효',tone:'pos',dday:dd};
}

/* ── 실행계획(단계·예상기간) 공통 헬퍼 ── */
function planDuration(g){
 if(g.result==='UNKNOWN')return '즉시~1주';
 const base={EVIDENCE:'1~2주',PROCESS:'2~4주',READINESS:'3~6주',ELIGIBILITY:'요건별 상이',STRATEGY:'2~4주'}[g.cls]||'2~4주';
 return (g.difficulty==='high'||g.difficulty==='HIGH')?base+' 이상':base;
}
function planFix(g){
 if(g.need_info&&g.need_info.length)return g.need_info.join(', ')+' 준비';
 if(g.explain)return g.explain;
 return '요건 충족을 위한 자료·상태 보완';
}
/* results 배열 → 단계별 실행계획 */
function buildActionPlan(results){
 const P1=[],P2=[],P3=[];
 (results||[]).forEach(r=>{ (r.gaps||[]).forEach(g=>{
  const task={prog:(typeof progName==='function'?progName(r.program_id):r.program_id),name:g.name,cls:g.cls,result:g.result,duration:planDuration(g),fix:planFix(g)};
  if(g.result==='UNKNOWN')P1.push(task);
  else if(g.result==='FAIL'&&g.cls==='ELIGIBILITY')P2.push(task);
  else if(g.result==='FAIL')P3.push(task);
 });});
 const phases=[];
 if(P1.length)phases.push({title:'1단계 · 정보 확인',desc:'미확인 항목을 먼저 확인해 진단 정확도를 높입니다.',tasks:P1});
 if(P2.length)phases.push({title:'2단계 · 기본요건 정비',desc:'신청 자격에 직결되는 요건을 충족시킵니다.',tasks:P2});
 if(P3.length)phases.push({title:'3단계 · 준비·서류 보완',desc:'평가·심사 대비 준비 수준을 끌어올립니다.',tasks:P3});
 return phases;
}

<script>
/* v0.2 범용 Rule Engine (지시서 10~13·73)
   센터·프로그램에 종속되지 않는 순수 판정 엔진.
   결과: PASS | FAIL | UNKNOWN | NOT_APPLICABLE
   축1 Eligibility: ELIGIBLE | CHECK_REQUIRED | NOT_ELIGIBLE | NOT_APPLICABLE
   축2 Readiness  : READY | NEEDS_WORK | EARLY_STAGE | NOT_ASSESSED
   원칙:
   - NOT_ELIGIBLE은 VERIFIED + OFFICIAL + ELIGIBILITY Rule의 FAIL로만 발생.
   - DRAFT Rule FAIL은 최대 CHECK_REQUIRED (검증 전 기준으로 탈락 금지).
   - INTERNAL Rule은 Eligibility에 관여하지 않음.
   - EVALUATION(평가영역)·STRATEGY는 축 판정에 넣지 않음. */

/* 파생 Fact 계산 (지시서 8: 부채비율 등 SYSTEM_CALCULATED) */
function deriveFacts(f0){
 const f={...f0};
 f.company_age_years=yearsFrom(f.founded);
 // 부채비율 = 부채/자본 (자본>0)
 if(f.liabilities!=null&&f.equity!=null&&Number(f.equity)>0&&(f.debt_ratio==null||f.debt_ratio===''))
  f.debt_ratio=Math.round(Number(f.liabilities)/Number(f.equity)*100);
 // 0 정규화: 활동이 '없음'이면 관련 수치 0
 if(f.rnd_active==='no'){ if(!f.has_lab)f.has_lab='none';
  for(const k of ['rnd_staff','rnd_staff_qualified','rnd_expense']) if(f[k]===''||f[k]==null)f[k]=0;
  if(!f.rnd_space||f.rnd_space==='unknown')f.rnd_space='no'; }
 if(f.invest_received==='no'&&(f.invest_amount===''||f.invest_amount==null))f.invest_amount=0;
 return f;
}

function checkApplicability(rule,f){
 const ap=rule.applicability; if(!ap||!ap.when)return {applicable:true};
 for(const [key,cond] of Object.entries(ap.when)){
  const v=key==='company_age_years'?f.company_age_years:f[key];
  if(cond.gte!=null){ if(v==null||v==='')return {applicable:true,uncertain:true}; if(Number(v)<cond.gte)return {applicable:false,reason:ap.na_reason}; }
  if(cond.lte!=null){ if(v==null||v==='')return {applicable:true,uncertain:true}; if(Number(v)>cond.lte)return {applicable:false,reason:ap.na_reason}; }
  if(cond.eq!=null && v!==cond.eq)return {applicable:false,reason:ap.na_reason};
  if(cond.ne!=null && v===cond.ne)return {applicable:false,reason:ap.na_reason};
  if(cond.in!=null && !cond.in.includes(v))return {applicable:false,reason:ap.na_reason};
 }
 return {applicable:true};
}

function tierMin(rule,f){
 for(const t of rule.params.tiers){
  if(t.when==='venture'&&f.is_venture==='yes')return t.min;
  if(t.when==='small_young'&&f.size_class==='small'&&f.company_age_years!=null&&f.company_age_years<3)return t.min;
  if(t.when==='small'&&f.size_class==='small')return t.min;
  if(t.when==='medium'&&f.size_class==='medium')return t.min;
  if(t.when==='large'&&f.size_class==='large')return t.min;
 }
 return null;
}

function evalRule(rule,f,optResolver){
 const ap=checkApplicability(rule,f);
 if(!ap.applicable)return {result:'NOT_APPLICABLE',current:'해당 없음',need:ap.reason||''};
 const num=(v)=>v===''||v==null||isNaN(Number(v))?null:Number(v);
 const p=rule.params||{};
 const lbl=(k,v)=>optResolver?optResolver(k,v):String(v);
 switch(rule.kind){
  case 'fact_eq':{ const v=f[p.key];
   if(v==null||v===''||v==='unknown')return {result:'UNKNOWN',current:'미확인',need:p.val==='yes'?'예':'해당'};
   return {result:v===p.val?'PASS':'FAIL',current:lbl(p.key,v),need:p.val==='yes'?'예':'해당'}; }
  case 'fact_ne':{ const v=f[p.key]; // 예: 체납 '없음'이어야 통과
   if(v==null||v===''||v==='unknown')return {result:'UNKNOWN',current:'미확인',need:'없음'};
   return {result:v!==p.val?'PASS':'FAIL',current:lbl(p.key,v),need:'없음'}; }
  case 'fact_in':{ const v=f[p.key];
   if(v==null||v===''||v==='unknown')return {result:'UNKNOWN',current:'미확인',need:'보유'};
   return {result:p.vals.includes(v)?'PASS':'FAIL',current:lbl(p.key,v),need:'보유'}; }
  case 'num_min':{ const v=num(f[p.key]); const need=fmt(p.min)+(p.unit||'')+' 이상';
   if(v==null)return {result:'UNKNOWN',current:'미입력',need};
   return {result:v>=p.min?'PASS':'FAIL',current:fmt(v)+(p.unit||''),need}; }
  case 'num_max':{ const v=num(f[p.key]); const need=fmt(p.max)+(p.unit||'')+' 이하';
   if(v==null)return {result:'UNKNOWN',current:'미입력',need};
   return {result:v<=p.max?'PASS':'FAIL',current:fmt(v)+(p.unit||''),need}; }
  case 'num_range':{ const v=num(f[p.key]); const need=fmt(p.min)+'~'+fmt(p.max)+(p.unit||'');
   if(v==null)return {result:'UNKNOWN',current:'미입력',need};
   return {result:(v>=p.min&&v<=p.max)?'PASS':'FAIL',current:fmt(v)+(p.unit||''),need}; }
  case 'tier_min':{ const min=tierMin(rule,f); const v=num(f[p.key]);
   if(min==null)return {result:'UNKNOWN',current:v==null?'미확인':fmt(v)+(p.unit||''),need:'기업 규모 확인 필요'};
   const need=fmt(min)+(p.unit||'')+' 이상';
   if(v==null)return {result:'UNKNOWN',current:'미입력',need};
   return {result:v>=min?'PASS':'FAIL',current:fmt(v)+(p.unit||''),need}; }
  case 'age_min':{ const age=f.company_age_years;
   if(age==null)return {result:'UNKNOWN',current:'설립일 미입력',need:p.min+'년 이상'};
   return {result:age>=p.min?'PASS':'FAIL',current:'업력 '+age+'년',need:p.min+'년 이상'}; }
  case 'age_max':{ const age=f.company_age_years;
   if(age==null)return {result:'UNKNOWN',current:'설립일 미입력',need:p.max+'년 이하'};
   return {result:age<=p.max?'PASS':'FAIL',current:'업력 '+age+'년',need:p.max+'년 이하'}; }
  case 'ratio_min':{ const nu=num(f[p.numer]),de=num(f[p.denom]); const need=p.minPct+'% 이상'+(p.note?'('+p.note+')':'');
   if(nu==null||de==null||de===0)return {result:'UNKNOWN',current:'재무정보 미확인',need};
   const pct=nu/(de*(p.denomMul||1))*100;
   return {result:pct>=p.minPct?'PASS':'FAIL',current:pct.toFixed(1)+'%',need}; }
  case 'composite_any':{ let hit=0,unk=0;
   p.keys.forEach(k=>{const v=f[k.key]; if(v==null||v===''||v==='unknown')unk++; else if(v===k.val)hit++;});
   if(hit>=p.needCount)return {result:'PASS',current:hit+'개 확인',need:p.needCount+'개 이상'};
   if(hit+unk>=p.needCount)return {result:'UNKNOWN',current:hit+'개 확인·'+unk+'개 미확인',need:p.needCount+'개 이상'};
   return {result:'FAIL',current:hit+'개 확인',need:p.needCount+'개 이상'}; }
  case 'scale_min':{ const v=num(f[p.key]); const need=p.min+'단계 이상';
   if(v==null)return {result:'UNKNOWN',current:'미평가',need};
   return {result:v>=p.min?'PASS':'FAIL',current:v+'단계',need}; }
  case 'external_eval': return {result:'UNKNOWN',current:'기관 평가 영역',need:'신청 후 평가'};
  default: return {result:'UNKNOWN',current:'-',need:'-'};
 }
}

/* ── 축 계산 ── */
function calcEligibility(rr){
 const el=rr.filter(x=>x.cls==='ELIGIBILITY');
 const applicable=el.filter(x=>x.result!=='NOT_APPLICABLE');
 if(el.length&&!applicable.length)return {axis:'NOT_APPLICABLE',verifiedFail:[],draftFail:[],unknown:[]};
 const verifiedFail=applicable.filter(x=>x.result==='FAIL'&&x.status==='VERIFIED'&&x.source_type==='OFFICIAL');
 const draftFail=applicable.filter(x=>x.result==='FAIL'&&!(x.status==='VERIFIED'&&x.source_type==='OFFICIAL'));
 const unknown=applicable.filter(x=>x.result==='UNKNOWN');
 let axis;
 if(verifiedFail.length)axis='NOT_ELIGIBLE';
 else if(draftFail.length||unknown.length)axis='CHECK_REQUIRED';
 else axis='ELIGIBLE';
 return {axis,verifiedFail,draftFail,unknown};
}
function calcReadiness(rr){
 const pool=rr.filter(x=>['READINESS','PROCESS','EVIDENCE'].includes(x.cls)&&x.result!=='NOT_APPLICABLE');
 if(!pool.length)return {axis:'NOT_ASSESSED',passW:0,totalW:0};
 const assessed=pool.filter(x=>x.result!=='UNKNOWN');
 if(!assessed.length)return {axis:'NOT_ASSESSED',passW:0,totalW:pool.reduce((s,x)=>s+(x.weight||1),0)};
 const totalW=pool.reduce((s,x)=>s+(x.weight||1),0);
 const passW=pool.filter(x=>x.result==='PASS').reduce((s,x)=>s+(x.weight||1),0);
 const failed=pool.some(x=>x.result==='FAIL');
 const ratio=totalW?passW/totalW:0;
 let axis;
 if(ratio>=0.75&&!failed)axis='READY';
 else if(ratio>=0.35||passW>0)axis='NEEDS_WORK';
 else axis='EARLY_STAGE';
 return {axis,passW,totalW,ratio};
}
const SUMMARY_ORDER={A:0,B:1,C:2,D:3,E:4};
function summarize(elig,ready){
 if(elig.axis==='NOT_APPLICABLE')return 'D';
 if(elig.axis==='NOT_ELIGIBLE'){ const allTime=elig.verifiedFail.every(x=>x.time_based); return allTime?'D':'E'; }
 if(elig.axis==='CHECK_REQUIRED'){
  if(elig.draftFail.some(x=>x.difficulty==='high'))return 'D';
  if(elig.draftFail.length)return 'C';
  return 'B';
 }
 if(ready.axis==='READY')return 'A';
 if(ready.axis==='NOT_ASSESSED')return 'B';
 return 'C';
}

/* Rule 배열 평가 (RETIRED 제외) */
function evalRuleSet(rules,f,optResolver){
 return rules.filter(r=>r.status!=='RETIRED').map(r=>{
  const e=evalRule(r,f,optResolver);
  return {rule_id:r.id,name:r.name,cls:r.cls,track:r.track||null,result:e.result,current:e.current,need:e.need,
   weight:r.weight||1,difficulty:r.difficulty,remediable:r.remediable!==false,time_based:!!r.time_based,
   status:r.status,source_type:r.source?.type||'INTERNAL',explain:r.explain||'',need_info:r.need_info||[]};
 });
}
function axisPack(rr){
 const elig=calcEligibility(rr); const ready=calcReadiness(rr);
 const counts={
  eligOk:rr.filter(x=>x.cls==='ELIGIBILITY'&&x.result==='PASS').length,
  eligTotal:rr.filter(x=>x.cls==='ELIGIBILITY'&&x.result!=='NOT_APPLICABLE').length,
  readyOk:rr.filter(x=>['READINESS','PROCESS','EVIDENCE'].includes(x.cls)&&x.result==='PASS').length,
  readyTotal:rr.filter(x=>['READINESS','PROCESS','EVIDENCE'].includes(x.cls)&&x.result!=='NOT_APPLICABLE').length,
  unknown:rr.filter(x=>x.result==='UNKNOWN'&&x.cls!=='EVALUATION').length,
  evalAreas:rr.filter(x=>x.cls==='EVALUATION'&&x.result!=='NOT_APPLICABLE').length};
 const gaps=rr.filter(x=>['FAIL','UNKNOWN'].includes(x.result)&&x.cls!=='EVALUATION')
  .sort((a,b)=>(a.result==='FAIL'?0:1)-(b.result==='FAIL'?0:1)||(a.cls==='ELIGIBILITY'?0:1)-(b.cls==='ELIGIBILITY'?0:1))
  .map(x=>({name:x.name,cls:x.cls,result:x.result,difficulty:x.difficulty,explain:x.explain,need_info:x.need_info,current:x.current,need:x.need,draft:x.status==='DRAFT'}));
 return {eligibility:elig.axis,eligibility_detail:elig,readiness:ready.axis,readiness_detail:ready,
  summary:summarize(elig,ready),counts,gaps,rules:rr};
}

<script>
/* v0.2 진단 엔진 — 프로그램(+Track) 단위 평가, 센터 통합 실행 (지시서 15·48) */

/* 프로그램 단위 평가 (Track 지원, 지시서 21) */
function evalProgram(prog,f,allRules,optResolver){
 const rules=allRules.filter(r=>r.program===prog.id);
 if(!prog.tracks){ const rr=evalRuleSet(rules,f,optResolver); return {program_id:prog.id,center:prog.center,tracked:false,...axisPack(rr)}; }
 const common=rules.filter(r=>!r.track);
 const trackOrder={ELIGIBLE:0,CHECK_REQUIRED:1,NOT_ELIGIBLE:2,NOT_APPLICABLE:3};
 const tracks=prog.tracks.map(t=>{
  const own=rules.filter(r=>r.track===t.id);
  const pack=axisPack(evalRuleSet([...common,...own],f,optResolver));
  const ownElig=pack.rules.filter(x=>x.track===t.id&&x.cls==='ELIGIBILITY');
  if(ownElig.length&&ownElig.every(x=>x.result==='NOT_APPLICABLE')){pack.eligibility='NOT_APPLICABLE';pack.summary='D';}
  if(!ownElig.length&&pack.rules.some(x=>x.track===t.id&&x.cls==='EVALUATION')){pack.eval_driven=true;if(pack.summary==='A')pack.summary='B';}
  pack.spec_pass=ownElig.filter(x=>x.result==='PASS').length;
  return {track_id:t.id,track_name:t.name,...pack};
 });
 const best=[...tracks].sort((a,b)=>trackOrder[a.eligibility]-trackOrder[b.eligibility]||(b.spec_pass-a.spec_pass)||(SUMMARY_ORDER[a.summary]-SUMMARY_ORDER[b.summary]))[0];
 return {program_id:prog.id,center:prog.center,tracked:true,tracks,recommended_track:best.track_id,eval_driven:!!best.eval_driven,

function diagnoseCenter(center,facts,rules,programs,optResolver){

<script>
/* v0.2 추천 엔진 — 사용자에게 점수 대신 '1순위 · 지금 검토' (지시서 61~62) */
function progScore(r,all){
 const eligS={ELIGIBLE:50,CHECK_REQUIRED:32,NOT_APPLICABLE:0,NOT_ELIGIBLE:2}[r.eligibility]||0;
 const readyS={READY:22,NEEDS_WORK:12,EARLY_STAGE:5,NOT_ASSESSED:8}[r.readiness]||0;
 const unknownPenalty=Math.min(r.counts.unknown*3,12);
 const diffPenalty=r.gaps.some(g=>g.result==='FAIL'&&g.difficulty==='high')?10:0;
 const evalPenalty=r.eval_driven?18:0;
 let syn=0,prereq=0;
 (window.RELATIONS||[]).forEach(rel=>{
  if(rel.type==='SYNERGY'&&rel.from===r.program_id)syn+=6;
  if((rel.type==='REQUIRED'||rel.type==='RECOMMENDED_BEFORE')&&(rel.to===r.program_id||rel.to_alt===r.program_id)&&all){
   const dep=all.find(x=>x.program_id===rel.from);
   if(dep&&['A','B','C'].includes(dep.summary))prereq+=8;
  }
 });
 return eligS+readyS+syn+prereq-unknownPenalty-diffPenalty-evalPenalty;
}
function suppressAlternatives(list){
 const ids=new Set(list.map(r=>r.program_id)); const drop=new Set();
 (window.RELATIONS||[]).forEach(rel=>{
  if(rel.type==='ALTERNATIVE'&&ids.has(rel.from)&&ids.has(rel.to)){
   const from=list.find(x=>x.program_id===rel.from);
   if(from&&!['NOT_ELIGIBLE','NOT_APPLICABLE'].includes(from.eligibility))drop.add(rel.to);
  }});
 return list.filter(r=>!drop.has(r.program_id));
}
function reasonsFor(r,all){
 const out=[];
 if(r.eligibility==='ELIGIBLE')out.push('확인된 기본요건을 충족하고 있어요.');
 if(r.eligibility==='CHECK_REQUIRED')out.push(r.counts.unknown?'확인이 필요한 항목이 '+r.counts.unknown+'개 있어요.':'검증 중인 기준에서 보완할 항목이 있어요.');
 if(r.eligibility==='NOT_ELIGIBLE')out.push('현재 확인된 정보로는 기본요건을 충족하지 못해요.');
 if(r.eligibility==='NOT_APPLICABLE')out.push('현재 기업 상황에는 해당하지 않아요.');
 if(r.readiness==='READY')out.push('내부 준비상태도 좋은 편이에요.');
 if(r.readiness==='NEEDS_WORK')out.push('평가·심사 대비 준비를 일부 보완하면 좋아요.');
 if(r.tracked&&r.recommended_track){ const t=(window.PROG_MAP[r.program_id].tracks||[]).find(t=>t.id===r.recommended_track); if(t)out.push('지금은 '+t.name+' 검토가 가장 현실적이에요.'); }
 (window.RELATIONS||[]).forEach(rel=>{ if(rel.type==='SYNERGY'&&rel.from===r.program_id)out.push(rel.note); });
 return out.slice(0,3);
}
/* 그룹: 지금(A·B) / 다음(C) / 장기(D·E) */
function groupResults(results){
 const g={now:[],next:[],later:[]};
 results.forEach(r=>{ if(['A','B'].includes(r.summary))g.now.push(r); else if(r.summary==='C')g.next.push(r); else g.later.push(r); });
 for(const k of Object.keys(g))g[k].sort((a,b)=>progScore(b,results)-progScore(a,results));
 return g;
}
function priorityList(results){
 return [...results].sort((a,b)=>progScore(b,results)-progScore(a,results))
  .map((r,i)=>({program_id:r.program_id,rank:i+1,
   label:['A','B'].includes(r.summary)?'지금 검토':r.summary==='C'?'다음 검토':r.summary==='E'?'현재 대상 아님':'장기 준비',
   reasons:reasonsFor(r,results),score:progScore(r,results)}));
}
function topPick(results){
 const list=suppressAlternatives(results.filter(r=>['A','B','C'].includes(r.summary)));
 const tier=(r)=>['A','B'].includes(r.summary)?0:1;
 return list.sort((a,b)=>tier(a)-tier(b)||progScore(b,results)-progScore(a,results))[0]||null;
}

<script>
/* v0.2 종합 로드맵 엔진 — 3개 센터 결과 통합 (지시서 41~43)
   관계(REQUIRED/RECOMMENDED_BEFORE/SYNERGY/ALTERNATIVE/INDEPENDENT)로 실행순서 산출 */
function integratedPath(allResults){
 // 검토 가치 있는 프로그램(A~C)만, 점수순
 let cand=[...allResults].filter(r=>['A','B','C'].includes(r.summary))
  .sort((a,b)=>progScore(b,allResults)-progScore(a,allResults)).map(r=>r.program_id);
 // ALTERNATIVE: 상위 하나만
 (window.RELATIONS||[]).filter(x=>x.type==='ALTERNATIVE').forEach(rel=>{
  if(cand.includes(rel.from)&&cand.includes(rel.to))cand.splice(cand.indexOf(rel.to),1);
 });
 // REQUIRED·RECOMMENDED_BEFORE: 선행을 앞으로
 const before=(pre,post)=>{const ip=cand.indexOf(pre),io=cand.indexOf(post);
  if(ip>=0&&io>=0&&ip>io){cand.splice(ip,1);cand.splice(cand.indexOf(post),0,pre);}};
 (window.RELATIONS||[]).forEach(rel=>{ if(rel.type==='REQUIRED'||rel.type==='RECOMMENDED_BEFORE')before(rel.to,rel.from); });
 return cand;
}
function pathNotes(path){
 const notes=[];
 (window.RELATIONS||[]).forEach(rel=>{
  const preIn=path.includes(rel.to),postIn=path.includes(rel.from);
  if(rel.type==='REQUIRED'&&postIn)notes.push({text:rel.note,kind:'필수 선행'});
  if(rel.type==='RECOMMENDED_BEFORE'&&preIn&&postIn)notes.push({text:rel.note,kind:'추천'});
  if(rel.type==='SYNERGY'&&preIn)notes.push({text:rel.note,kind:'연계'});
 });
 const seen=new Set();
 return notes.filter(n=>!seen.has(n.text)&&seen.add(n.text)).slice(0,4);
}
/* 분기별 로드맵 생성 (지시서 43) */
function buildRoadmap(allResults){
 const path=integratedPath(allResults); const out=[]; let q=0; const base=new Date();
 const quarter=(add)=>{ const d=new Date(base.getFullYear(),base.getMonth()+add*3,1);
  return d.getFullYear()+' Q'+(Math.floor(d.getMonth()/3)+1); };
 path.forEach(pid=>{
  const r=allResults.find(x=>x.program_id===pid); const p=window.PROG_MAP[pid];
  const prep=r.summary==='A'?0:r.summary==='B'?1:2;
  out.push({q:quarter(q+prep),label:p.name+(r.summary==='A'?' 진행 검토':' 정밀진단·준비'),program:pid,center:p.center});
  q+=prep+1;
 });
 // 분기별 그룹화
 const byQ={};
 out.forEach(o=>{ (byQ[o.q]=byQ[o.q]||[]).push(o); });
 return Object.entries(byQ).map(([q,items])=>({q,items}));
}

<script>
/* 재무분석 엔진 — KBMC 재무분석 진단 도구 로직 이식(확정 기준)
   입력: 연도별 재무 항목 → 8개 지표 산출 → 등급 → 정책금융 접근성 판정 */
const FIN_METRICS=['유동비율','당좌비율','부채비율','매출채권회전율','영업이익율','이자보상배수','현금보유율','자본잠식률'];
const FIN_META={
 유동비율:{higher:true,unit:'%'}, 당좌비율:{higher:true,unit:'%'}, 부채비율:{higher:false,unit:'%'},
 매출채권회전율:{higher:true,unit:'회'}, 영업이익율:{higher:true,unit:'%'}, 이자보상배수:{higher:true,unit:'배'},
 현금보유율:{higher:true,unit:'%'}, 자본잠식률:{higher:false,unit:'%'}
};
/* 한 해 항목(obj) → 지표 */
function finCalcYear(d){
 const g=(k)=>{const v=parseFloat(d[k]);return isNaN(v)?0:v;};
 const sd=(a,b)=>(b!==0&&!isNaN(b))?a/b:0;
 const oi=g('operating_income'), ie=g('interest_expense'), cap=g('capital'), eq=g('equity');
 let icr; if(ie>0)icr=sd(oi,ie); else icr=oi>0?Infinity:0;
 let cap_erosion; if(cap===0)cap_erosion=0; else cap_erosion=(cap-eq)/cap*100;
 return {
  유동비율: sd(g('current_asset'),g('current_liability'))*100,
  당좌비율: sd(g('quick_asset'),g('current_liability'))*100,
  부채비율: sd(g('liability'),eq)*100,
  매출채권회전율: sd(g('revenue'),g('receivable')),
  영업이익율: sd(oi,g('revenue'))*100,
  이자보상배수: icr,
  현금보유율: sd(g('cash'),g('revenue'))*100,
  자본잠식률: cap_erosion
 };
}
/* 기준값 조회 (mode: bank/industry/total) */
function finStandard(metric, industryCode, mode){
 const noBank=['자본잠식률'];
 if(mode==='bank'){
  if(!noBank.includes(metric)){
   const cat=INDUSTRY_TO_BANK_CATEGORY[industryCode]||'제조업';
   const v=BANK_STANDARDS[metric]?.[cat];
   if(v!==undefined)return v;
  }
  const std=INDUSTRY_STANDARDS[industryCode]||INDUSTRY_STANDARDS['전체'];
  return std?.[metric] ?? INDUSTRY_STANDARDS['전체'][metric] ?? 0;
 }
 if(mode==='industry'){
  const std=INDUSTRY_STANDARDS[industryCode]||INDUSTRY_STANDARDS['전체'];
  return std?.[metric] ?? INDUSTRY_STANDARDS['전체'][metric] ?? 0;
 }
 return INDUSTRY_STANDARDS['전체'][metric] ?? 0;
}
/* 지표별 점수(원본 로직) */
function finMetricScore(metric, latestVal, industryCode, mode){
 if(latestVal===Infinity)return 100;
 if(metric==='자본잠식률'){ if(latestVal<=0)return 100; if(latestVal<=20)return 70; if(latestVal<=50)return 40; return 10; }
 const std=finStandard(metric,industryCode,mode);
 const higher=FIN_META[metric].higher;
 if(std===0)return 50;
 const ratio=higher? latestVal/std : std/latestVal;
 if(ratio>=1.5)return 100; if(ratio>=1.2)return 85; if(ratio>=1.0)return 70;
 if(ratio>=0.8)return 50; if(ratio>=0.6)return 30; return 10;
}
const FIN_WEIGHTS={유동비율:15,당좌비율:12,부채비율:18,매출채권회전율:10,영업이익율:18,이자보상배수:15,현금보유율:7,자본잠식률:5};
/* 종합 등급 산출 */
function finGrade(latest, industryCode, mode){
 let ts=0,tw=0; const scoreMap={};
 for(const [m,w] of Object.entries(FIN_WEIGHTS)){ const s=finMetricScore(m,latest[m],industryCode,mode); scoreMap[m]=s; ts+=s*w; tw+=w; }
 const score=Math.round(ts/tw);
 let grade,summary;
 if(score>=85){grade='A';summary='재무 안정성이 매우 우수한 기업입니다. 현 재무구조를 유지하며 성장 투자 여력을 활용하는 단계로 검토할 수 있습니다.';}
 else if(score>=70){grade='B';summary='전반적으로 양호한 재무구조입니다. 일부 취약 지표를 관리하면 정책금융·신용등급 개선이 가능합니다.';}
 else if(score>=55){grade='C';summary='주의가 필요한 재무구조입니다. 유동성·수익성 중 하나 이상에서 취약점이 있어 단기 개선 계획이 필요합니다.';}
 else if(score>=40){grade='D';summary='재무적으로 위험 신호가 복수 감지됩니다. 자금조달 제약·신용등급 하락 위험이 있어 구조 개선이 필요합니다.';}
 else{grade='E';summary='재무구조가 심각한 위험 수준입니다. 외부 자금조달이 어려우며 전문가 자문이 필요합니다.';}
 return {score,grade,summary,scoreMap};
}
/* 정책금융 접근성 판정 (요건 충족 여부 — 금액은 '예상' 표기, 판정에는 불사용) */
function finPolicyCheck(latest){
 const lv=(m)=>latest[m]??0;
 const inf=(m)=>lv(m)===Infinity;
 const pol=[
  {inst:'중소기업진흥공단(중진공)',product:'시설·운전자금',limit_est:'최대 100억원 예상',rate:'연 2~3%대(변동)',

   crit:['영업이익율 양수','이자보상배수 1.0배 이상','부채비율 200% 이하'],
   oks:[lv('영업이익율')>0, lv('이자보상배수')>=1||inf('이자보상배수'), lv('부채비율')<=200]},
  {inst:'수출입은행·무역보험공사',product:'수출금융·수출신용보증',limit_est:'수출실적 연동 예상',rate:'연 3~5%대',
   crit:['부채비율 300% 이하','매출채권회전율 4회 이상','영업이익율 양수'],
   oks:[lv('부채비율')<=300, lv('매출채권회전율')>=4, lv('영업이익율')>0]}
 ];
 return pol.map(p=>{ const passed=p.oks.filter(x=>x===true).length; const applicable=p.oks.filter(x=>x!==null).length;
  return {...p, verdict: passed>=2?'신청 가능 예상':'요건 보완 필요', passed, applicable}; });
}

function finDiagnose(dataByYear, years, industryCode, mode){

function facilityCost(f){
 const b=Number(f.fac_building_cost)||0, e=Number(f.fac_extra_cost)||0, q=Number(f.fac_equip_cost)||0;
 const total=b+e+q; const equity=Number(f.fac_equity)||0;
 return {building:b,extra:e,equip:q,total,equity,gap:Math.max(total-equity,0)};
}
/* 조달경로 추천 — 시설 진단 결과에서 자금센터 정밀진단으로 연결 (지시서 38) */
function fundingRoutes(f,allResults){
 const routes=[];
 const kibo=allResults.find(r=>r.program_id==='KIBO');
 const kodit=allResults.find(r=>r.program_id==='KODIT');
 const kosmes=allResults.find(r=>r.program_id==='KOSMES');
 if(f.fund_purpose==='facility'||true){
  routes.push({program:'KOSMES',label:'중진공 시설 관련 자금 정밀진단',hint:'시설투자 목적에 맞는 정책자금군을 확인해요.'});

}

function a11yEnhance(){

  const tag=el.tagName.toLowerCase();
  if(tag==='button'||tag==='a'||tag==='select'||tag==='input')return;
  if(!el.hasAttribute('role'))el.setAttribute('role','button');

  if(el.dataset.tip&&!el.hasAttribute('aria-label'))el.setAttribute('aria-label',el.dataset.tip);
 });

 });

<script>
/* 진단 공통 — 빠른(센터 통합)진단·정밀진단·결과 (지시서 15~16·52) */
let WZ=null;
/* 질문 렌더링 (조건부 노출·scale 지원) */
function qHtml(q,a){
 const v=a[q.key];
 if(q.type==='choice')return `<div class="choice">${q.opts.map(o=>`<button class="${v===o[0]?'on':''}" onclick="wzChoice('${q.key}','${o[0]}')">${esc(o[1])}</button>`).join('')}</div>`;
 if(q.type==='scale')return `<div class="scale">${q.opts.map(o=>`<button class="scale-opt ${String(v)===o[0]?'on':''}" onclick="wzChoice('${q.key}','${o[0]}')"><b>${o[0]}</b> ${esc(o[1])}</button>`).join('')}</div>`;
 if(q.type==='select')return `<select onchange="wzVal('${q.key}',this.value)"><option value="">선택</option>${q.opts.map(o=>`<option value="${o[0]}" ${v===o[0]?'selected':''}>${esc(o[1])}</option>`).join('')}</select>`;
 if(q.type==='ksic'){
  const maj=a.ksic_major||'',mid=a.ksic_mid||'',sub=a.ksic_sub||'',se=a.ksic_se||'';
  const T=(typeof KSIC_TREE!=='undefined')?KSIC_TREE:{};
  const majList=(typeof KSIC_ORDER!=='undefined'?KSIC_ORDER:Object.keys(T));
  const midObj=maj?(T[maj]?.m||{}):{};
  const subObj=(maj&&mid)?(midObj[mid]?.s||{}):{};
  const seObj=(maj&&mid&&sub)?(subObj[sub]?.e||{}):{};
  const ssObj=(maj&&mid&&sub&&se)?(seObj[se]?.d||{}):{};
  const sel=(onc,cur,opts,ph)=>`<select onchange="${onc}"><option value="">${ph}</option>${opts.map(o=>`<option value="${o[0]}" ${cur===o[0]?'selected':''}>${esc(o[1])}</option>`).join('')}</select>`;
  return `<div class="ksic-select">
   ${sel(`ksicPick('major',this.value)`,maj,majList.map(c=>[c,c+' '+T[c].n]),'대분류 선택')}
   ${maj?sel(`ksicPick('mid',this.value)`,mid,Object.entries(midObj).map(([c,o])=>[c,c+' '+o.n]),'중분류 선택'):''}
   ${(maj&&mid)?sel(`ksicPick('sub',this.value)`,sub,Object.entries(subObj).map(([c,o])=>[c,c+' '+o.n]),'소분류 선택'):''}
   ${(maj&&mid&&sub)?sel(`ksicPick('se',this.value)`,se,Object.entries(seObj).map(([c,o])=>[c,c+' '+o.n]),'세분류 선택(선택)'):''}
   ${(maj&&mid&&sub&&se&&Object.keys(ssObj).length)?sel(`ksicPick('ss',this.value)`,a.ksic_ss||'',Object.entries(ssObj).map(([c,n])=>[c,c+' '+n]),'세세분류 선택(선택)'):''}
   ${a.ksic?`<div class="ksic-picked">선택된 코드: <b>${esc(a.ksic)}</b>${a.ksic_name?' · '+esc(a.ksic_name):''}</div>`:''}
  </div>`;
 }

 return `<input type="${q.type}" value="${esc(v??'')}" oninput="wzVal('${q.key}',this.value)" ${q.type==='number'?'step="any"':''}>`;
}
function renderQs(qs,a){
 return qs.filter(q=>!q.show||q.show(a)).map(q=>`<div class="q"><label class="q-t">${esc(q.t)}${q.req?' <span style="color:var(--danger)">*</span>':''}</label>${q.help?`<div class="q-h">${esc(q.help)}</div>`:''}${qHtml(q,a)}</div>`).join('');
}
function ansObj(){ return (typeof WZ!=='undefined'&&WZ)?WZ.answers:(typeof REG!=='undefined'?REG:null); }

 const a=ansObj(); if(!a)return; const T=(typeof KSIC_TREE!=='undefined')?KSIC_TREE:{};
 if(level==='major'){ a.ksic_major=val; a.ksic_mid='';a.ksic_sub='';a.ksic_se='';a.ksic_ss='';
  a.ksic=val; a.ksic_name=T[val]?T[val].n:''; const meta=(typeof KSIC_MAJOR_META!=='undefined')&&KSIC_MAJOR_META[val];
  if(meta&&meta.ind&&!a.industry)a.industry=meta.ind; }
 if(level==='mid'){ a.ksic_mid=val;a.ksic_sub='';a.ksic_se='';a.ksic_ss=''; a.ksic=val; a.ksic_name=T[a.ksic_major]?.m[val]?.n||''; }
 if(level==='sub'){ a.ksic_sub=val;a.ksic_se='';a.ksic_ss=''; a.ksic=val; a.ksic_name=T[a.ksic_major]?.m[a.ksic_mid]?.s[val]?.n||''; }
 if(level==='se'){ a.ksic_se=val;a.ksic_ss=''; a.ksic=val; a.ksic_name=T[a.ksic_major]?.m[a.ksic_mid]?.s[a.ksic_sub]?.e[val]?.n||''; }
 if(level==='ss'){ a.ksic_ss=val; a.ksic=val; a.ksic_name=T[a.ksic_major]?.m[a.ksic_mid]?.s[a.ksic_sub]?.e[a.ksic_se]?.d[val]||''; }
 reRender();
}

function wzNext(){

 for(const q of s.qs){ if(q.req&&(!q.show||q.show(WZ.answers))&&(WZ.answers[q.key]==null||WZ.answers[q.key]===''))return toast('"'+q.t+'" 항목을 입력해주세요.'); }

 finishDiag('quick');
}

 // 저장된 최신 진단에서 need_info 취합 (재렌더에도 안정적)

 if(r)(r.gaps||[]).forEach(g=>(g.need_info||[]).forEach(d=>{if(!set.includes(d))set.push(d);}));
 return set;
}
const DOC_STATUS={RECEIVED:{t:'받음',tone:'pos'},MISSING:{t:'미비',tone:'warn'},NA:{t:'해당없음',tone:'neutral'}};
function checklistHtml(orgId,program){

 const done=docs.filter(d=>st[d]&&st[d].status==='RECEIVED').length;

}

   라우트: #/report/{orgId}            → 종합 진단보고서(최근 진단 취합)

 } else {

/* 제도별 세부 블록 — 판정 + 미충족 항목의 현재값→필요값→확보방법 */
function reportProgramBlock(r){
 const gaps=(r.gaps||[]);
 const fails=gaps.filter(g=>g.result==='FAIL');
 const unknowns=gaps.filter(g=>g.result==='UNKNOWN');
 return `<div class="rp-prog">
  <div class="rp-prog-h"><b>${esc(progName(r.program_id))}</b>
   <span>${esc(ELIG_LABEL[r.eligibility]||'')} · ${esc(READY_LABEL[r.readiness]||'')}</span></div>
  ${r.tracked&&r.recommended_track?`<div class="rp-track">추천 유형: ${esc(trackName(r.program_id,r.recommended_track))}</div>`:''}
  ${(fails.length||unknowns.length)?`
   <table class="rp-gap"><thead><tr><th>점검 항목</th><th>현재</th><th>필요</th><th>보완 방법</th></tr></thead><tbody>
    ${fails.map(g=>`<tr class="gap-fail"><td>${esc(g.name)}${g.draft?' <span class="rp-draft">기준 확인중</span>':''}</td><td>${esc(g.current||'-')}</td><td>${esc(g.need||'-')}</td><td>${esc(gapFix(g))}</td></tr>`).join('')}
    ${unknowns.map(g=>`<tr class="gap-unk"><td>${esc(g.name)}</td><td>미확인</td><td>${esc(g.need||'확인')}</td><td>해당 정보 확인·입력 필요</td></tr>`).join('')}
   </tbody></table>`:'<div class="rp-ok">현재 확인된 미충족·미확인 항목이 없습니다.</div>'}
 </div>`;
}
/* 보완 방법 문구 — need_info(필요서류) 우선, 없으면 일반 안내 */
function gapFix(g){
 if(g.need_info&&g.need_info.length)return g.need_info.join(', ')+' 준비';
 if(g.explain)return g.explain;
 return '요건 충족을 위한 자료·상태 보완';
}
/* 실행 과제 — 난이도 정렬, 미충족 우선 */
function reportActionPlan(rows){
 const phases=buildActionPlan(rows.map(x=>x.r));
 if(!phases.length)return '<div class="rp-ok">현 단계에서 즉시 필요한 실행 과제가 없습니다. 정밀진단으로 세부 준비상태를 점검하세요.</div>';
 let n=0;
 return phases.map(ph=>`<div class="rp-phase">
   <div class="rp-phase-h">${esc(ph.title)}<span>${esc(ph.desc)}</span></div>
   <table class="rp-table"><thead><tr><th>순번</th><th>제도</th><th>과제</th><th>예상기간</th><th>실행 방법</th></tr></thead><tbody>
    ${ph.tasks.map(t=>`<tr><td>${++n}</td><td>${esc(t.prog)}</td><td>${esc(t.name)}</td><td>${esc(t.duration)}</td><td>${esc(t.fix)}</td></tr>`).join('')}
   </tbody></table></div>`).join('')
 +`<p class="rp-note">※ 예상기간은 일반적 준비 기준에 따른 추정이며, 실제 소요는 기업 상황에 따라 달라집니다. 단계 순서대로 진행하되 세부 일정·담당은 컨설턴트와 협의하여 확정하세요.</p>`;
}
/* 필요 서류 — 제도별 need_info 취합(중복 제거) */
function reportDocs(rows){
 const out=[];
 rows.forEach(({r,d})=>{
  const set=new Set();
  (r.gaps||[]).forEach(g=>(g.need_info||[]).forEach(x=>set.add(x)));
  const gd=(typeof GUIDES!=='undefined')&&GUIDES[r.program_id];
  if(gd&&gd.docs)gd.docs.forEach(x=>set.add(x));
  if(!set.size)return;
  const orgId=d.organization_id; const st=(typeof DB!=='undefined')?DB.checklist(orgId,r.program_id):{};
  const LB={RECEIVED:'받음',MISSING:'미비',NA:'해당없음'};
  out.push(`<div class="rp-docs"><b>${esc(progName(r.program_id))}</b><table class="rp-doctbl"><tbody>${[...set].map(x=>{const s=st[x]?.status;return `<tr><td>${esc(x)}</td><td class="rp-dc rp-dc-${s||'none'}">${s?LB[s]:'미확인'}</td></tr>`;}).join('')}</tbody></table></div>`);
 });
 if(!out.length)return '<div class="rp-ok">진단 기준상 특별히 요구되는 서류가 식별되지 않았습니다. 제도별 실무가이드를 참고하세요.</div>';
 return out.join('');
}

 setCrumb('재무진단');
 const c=DB.current();
 if(!c){ $('#view').innerHTML='<div class="empty"><div class="big">기업을 먼저 선택해주세요</div><div style="margin-top:12px"><button class="btn btn-pri" onclick="pickCompany()">기업 선택</button></div></div>'; return; }
 // 저장된 재무 or 초기화
 const saved=DB.finance(c.id);
 const thisYear=new Date().getFullYear();
 if(!FIN_STATE||FIN_STATE.orgId!==c.id){
  FIN_STATE = saved ? {orgId:c.id,years:saved.years.slice(),data:JSON.parse(JSON.stringify(saved.data)),mode:saved.mode||'bank',industryCode:saved.industryCode||ksicToFinCode(c.facts.ksic)}
   : {orgId:c.id,years:[thisYear-2,thisYear-1,thisYear],data:{},mode:'bank',industryCode:ksicToFinCode(c.facts.ksic)};
 }
 finRender(c);
};
function finRender(c){
 const S=FIN_STATE; const industryName=(INDUSTRIES.find(i=>i.code===S.industryCode)?.name)||S.industryCode;
 const hasData=finHasInput();
 $('#view').innerHTML=`
  <div class="page-title">재무진단 센터</div>
  <div class="page-sub">${esc(c.name)} · 재무제표를 입력하면 8개 지표·종합등급·정책금융 접근성을 진단해요.</div>
  <div class="card major" style="margin-bottom:16px">
   <div class="row sp wrap" style="gap:10px;align-items:flex-end">
    <div><div class="xs">평가 기준</div>
     <div class="fin-mode">${Object.entries(FIN_MODE_LABEL).map(([k,v])=>`<button class="fm-b ${S.mode===k?'on':''}" onclick="finSetMode('${k}')" data-tip="${k==='bank'?'은행 여신심사 기준':k==='industry'?'업종 평균 기준':'전산업 평균 기준'}">${v}</button>`).join('')}</div></div>
    <div><div class="xs">적용 업종(재무 표준)</div>
     <select class="fin-ind" onchange="finSetIndustry(this.value)">${INDUSTRIES.map(i=>`<option value="${i.code}" ${S.industryCode===i.code?'selected':''}>${i.code} · ${esc(i.name)}</option>`).join('')}</select></div>
   </div>
   <div class="xs" style="margin-top:8px">업종은 기업 업종코드(${esc(c.facts.ksic||'-')})에서 자동 설정했어요. 필요하면 바꿀 수 있어요. 금액 단위는 <b>천원</b>으로 입력하세요.</div>
  </div>

  <div class="card" style="margin-bottom:16px">
   <div class="sec-title" style="margin-top:0">재무 데이터 입력 <span class="hint">단위: 천원</span></div>
   <div class="fin-years">${S.years.map((y,i)=>`<label>연도 ${i+1} <input type="number" value="${y}" onchange="finSetYear(${i},this.value)"></label>`).join('')}</div>
   <div class="fin-grid-wrap"><table class="fin-input"><thead><tr><th>항목</th>${S.years.map(y=>`<th>${y}년</th>`).join('')}</tr></thead><tbody>
    ${FIN_INPUTS.map(it=>`<tr><td class="fi-label">${esc(it.n)}</td>${S.years.map(y=>`<td><input type="number" class="fi-in" value="${(S.data[y]&&S.data[y][it.f])??''}" oninput="finSetVal(${y},'${it.f}',this.value)"></td>`).join('')}</tr>`).join('')}
   </tbody></table></div>
   <div class="row wrap" style="margin-top:14px">
    <button class="btn btn-pri" onclick="finDiagnoseNow()" data-tip="입력값으로 재무지표·등급·정책금융 접근성 진단">${ic('search',15)} 재무진단 실행</button>
    <button class="btn btn-line" onclick="finClear()" data-tip="입력값 초기화">초기화</button>
   </div>
  </div>
  <div id="finResult">${hasData&&FIN_STATE.result?finResultHtml(c):''}</div>`;
}
function finHasInput(){ const S=FIN_STATE; return S.years.some(y=>S.data[y]&&Object.values(S.data[y]).some(v=>v!==''&&v!=null)); }
function finSetMode(m){ FIN_STATE.mode=m; if(FIN_STATE.result)finDiagnoseNow(); else finRender(DB.current()); }
function finSetIndustry(code){ FIN_STATE.industryCode=code; if(FIN_STATE.result)finDiagnoseNow(); }
function finSetYear(i,v){ const y=parseInt(v)||FIN_STATE.years[i]; const old=FIN_STATE.years[i]; if(FIN_STATE.data[old]){FIN_STATE.data[y]=FIN_STATE.data[old]; if(y!==old)delete FIN_STATE.data[old];} FIN_STATE.years[i]=y; }
function finSetVal(y,f,v){ FIN_STATE.data[y]=FIN_STATE.data[y]||{}; FIN_STATE.data[y][f]=v; }
function finClear(){ FIN_STATE.data={}; FIN_STATE.result=null; finRender(DB.current()); }
function finDiagnoseNow(){
 const S=FIN_STATE;
 if(!finHasInput()){ toast&&toast('재무 데이터를 입력하세요'); return; }
 S.result=finDiagnose(S.data,S.years,S.industryCode,S.mode);
 const c=DB.current();
 DB.saveFinance(c.id,{years:S.years,data:S.data,mode:S.mode,industryCode:S.industryCode,grade:S.result.grade.grade,score:S.result.grade.score,latest:S.result.latest});
 DB.audit('재무진단 실행',orgName(c.id),'',S.result.grade.grade+' '+S.result.grade.score+'점','');
 const el=$('#finResult'); if(el){ el.innerHTML=finResultHtml(c); el.scrollIntoView({behavior:'smooth',block:'start'}); }
}
function finResultHtml(c){
 const S=FIN_STATE, R=S.result; if(!R)return '';
 const g=R.grade, ind=S.industryCode;
 const chip=(t)=>({excellent:'pos',good:'info',poor:'neg'}[t]||'neutral');
 return `
  <div class="fin-grade grade-${g.grade}">
   <div class="fg-circle">${g.grade}<small>종합등급</small></div>
   <div class="fg-body"><div class="fg-title">재무건전성 ${g.grade}등급 · ${g.score}점 / 100</div>
    <div class="fg-sum">${esc(g.summary)}</div>
    <div class="fg-scores">${Object.entries(g.scoreMap).map(([m,s])=>`<span class="fgs"><b style="color:${s>=80?'#34d399':s>=55?'#93c5fd':'#f87171'}">${s}</b>${m.length>5?m.slice(0,5):m}</span>`).join('')}</div>
   </div></div>

  <div class="sec-title">재무지표 3개년 (기준: ${FIN_MODE_LABEL[S.mode]})</div>
  <div class="fin-metrics">${FIN_METRICS.map(m=>{
    const meta=FIN_META[m]; const std=finStandard(m,ind,S.mode);
    const vals=S.years.map(y=>R.results[y][m]);
    return `<div class="fin-mcard">
     <div class="fm-head"><b>${m}</b><span class="xs">${FIN_MODE_LABEL[S.mode]} 기준 ${std===Infinity?'해당없음':std.toFixed(1)+meta.unit}</span></div>
     <div class="fm-years">${S.years.map((y,i)=>{const v=vals[i];const j=finJudge(v,std,meta.higher,m);
       return `<div class="fmy"><div class="xs">${y}년</div><div class="fmy-v">${finFmt(v,m)}${v===Infinity?'':meta.unit}</div>${chip(chip(j.tone),j.text)}</div>`;}).join('')}</div>
    </div>`;}).join('')}</div>

  <div class="sec-title">정책금융 접근성 <span class="hint">${S.years[S.years.length-1]}년 기준</span></div>
  <div class="fin-policy">
   ${R.policy.map(p=>`<div class="fp-row ${p.verdict.includes('가능')?'fp-ok':'fp-no'}">
     <div class="fp-main"><b>${esc(p.inst)}</b> <span class="xs">${esc(p.product)} · ${esc(p.limit_est)} · ${esc(p.rate)}</span>
      <div class="fp-crit">${p.crit.map((cr,i)=>`<span class="fp-c ${p.oks[i]===true?'c-ok':p.oks[i]===false?'c-no':'c-na'}">${p.oks[i]===true?'✓':p.oks[i]===false?'✗':'·'} ${esc(cr)}</span>`).join('')}</div></div>
     <div class="fp-verdict">${chip(p.verdict.includes('가능')?'pos':'warn',p.verdict)}</div>
    </div>`).join('')}
   <div class="xs" style="margin-top:8px">금액·한도는 기관 공시 기준의 <b>예상치</b>이며, 실제 한도·승인은 각 기관 심사로 결정돼요. 위 판정은 재무요건 1차 충족 여부만 나타내요.</div>
  </div>

  <div class="note-box" style="margin-top:16px"><b>정책자금 센터 연동</b> — 이 재무진단 결과는 정책자금 센터의 자금별 요건 판정에 반영돼요.
   <div class="row wrap" style="gap:6px;margin-top:8px"><button class="btn btn-pri btn-sm" onclick="location.hash='#/fund'" data-tip="재무요건이 반영된 정책자금 진단으로 이동">정책자금 센터에서 확인 →</button></div></div>
  <div class="xs" style="margin-top:10px">본 진단은 입력 재무수치 기반 정량 분석이며, 최종 판단 전 전문가 확인을 권장해요. 출처: KBMC 재무분석 기준.</div>`;
}
function finFmt(v,m){ if(v===Infinity)return '∞'; if(v===-Infinity)return '-∞'; if(m==='자본잠식률'){ if(v<=0)return '—'; return v.toFixed(2);} return v.toFixed(m==='매출채권회전율'?1:2); }

</script>

   </div></details>
  <div class="search-line"><input id="ksQ" aria-label="업종코드 검색" placeholder="업종명·코드로 검색 (예: 소프트웨어, 음식점, 62, 10110)" oninput="ksicSearch()"></div>
  <div id="ksResult"></div>
  <div id="ksGrid" class="ksic-grid">${KSIC_ORDER.map(L=>{const s=ksicMajor(L);const nMid=Object.keys(s.mids).length;
   return `<button class="ksic-card" onclick="location.hash='#/ksic/${L}'" ${s.hint?`data-tip="${esc(s.hint)}"`:''}>
    <span class="kc-code">${L}</span><span class="kc-name">${esc(s.name)}</span>
    <span class="kc-mid">${s.range?s.range+' · ':''}중분류 ${nMid}개</span>
    ${s.progs.length?`<span class="kc-progs">${s.progs.slice(0,3).map(p=>`<i class="mini-chip">${esc(PROG_MAP[p]?.short||p)}</i>`).join('')}</span>`:''}
   </button>`;}).join('')}</div>
  <div class="xs" style="margin-top:14px">${esc(KSIC_META.note)} · <a href="${KSIC_META.official}" target="_blank" rel="noopener" style="color:var(--navy);font-weight:700">통계청 통계분류포털 →</a></div>`;
}
function ksicSearch(){
 const q=($('#ksQ').value||'').trim().toLowerCase(); const grid=$('#ksGrid'), res=$('#ksResult');
 if(!q){ grid.style.display=''; res.innerHTML=''; return; }
 grid.style.display='none';
 const hits=ksicIndex().filter(x=>x.code.toLowerCase().includes(q)||x.name.toLowerCase().includes(q)).slice(0,60);
 res.innerHTML=hits.length?`<div class="card" style="padding:6px 18px">${hits.map(h=>{
   const href=h.leaf?`#/ksic/code/${h.code}`:(h.lvl==='대분류'?`#/ksic/${h.code}`:`#/ksic/${h.L}/${h.Mc}`);
   return `<div class="list-row click" onclick="location.hash='${href}'"><div><b>${esc(h.code)} · ${esc(h.name)}</b> <span class="tag">${h.lvl}</span></div>${ic('chevR',15)}</div>`;
 }).join('')}</div>`:'<div class="empty small">일치하는 업종이 없어요. 다른 키워드로 검색해보세요.</div>';
}
