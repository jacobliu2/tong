   ${s.def?`<p class="ksic-def">${esc(s.def)}</p>`:''}
   ${s.progs.length?`<div class="note-box" style="margin-top:14px"><b>검토 유리 제도</b> — ${esc(s.hint)}<div class="row wrap" style="gap:6px;margin-top:8px">${s.progs.map(p=>`<button class="chip chip-info" style="cursor:pointer;border:none" onclick="location.hash='#/${PROG_MAP[p].center.toLowerCase()}/${p}'" data-tip="${esc(PROG_MAP[p].name)} 진단으로 이동">${esc(PROG_MAP[p].short||p)} →</button>`).join('')}</div></div>`:''}

}
function ksicMidView(L,Mc){

  </div>`;
}
/* 세세분류 상세 — 정의·예시·제외 */
function ksicCodeDetail(code){

 if(!loc){ ksicHome(); return; }

 setCrumb('업종코드 · '+code);
 $('#view').innerHTML=`
  <button class="btn btn-txt btn-sm" onclick="location.hash='#/ksic/${loc.L}/${loc.Mc}'" data-tip="중분류로">${ic('chevL',15)} ${esc(M.n)}</button>
  <div class="card major" style="margin-top:10px">
   <div class="ksic-crumb">${loc.L} ${esc(s.name)} <span>›</span> ${loc.Mc} ${esc(M.n)} <span>›</span> ${loc.Sc} ${esc(S.n)} <span>›</span> ${loc.Ec} ${esc(E.n)}</div>
   <div class="row" style="gap:12px;align-items:center;margin-top:8px"><div class="ksic-badge" style="font-size:17px;width:64px;flex:0 0 64px">${code}</div>
    <div style="font-size:21px;font-weight:800">${esc(loc.name)}</div></div>
   ${det?`
    ${det.d?`<div class="bf-sec" style="margin-top:16px"><h4>정의</h4><div class="small" style="line-height:1.6">${esc(det.d)}</div></div>`:''}
    ${det.ex&&det.ex.length?`<div class="bf-sec"><h4>예시 (포함)</h4><div class="km-ex">${det.ex.map(x=>`<span class="km-tag">${esc(x)}</span>`).join('')}</div></div>`:''}
    ${det.x&&det.x.length?`<div class="bf-sec"><h4>제외</h4>${det.x.map(x=>`<div class="q-line">${esc(x)}</div>`).join('')}</div>`:''}
   `:'<div class="small muted" style="margin-top:14px">이 코드의 상세 설명은 통계청에서 확인하세요.</div>'}
   ${s.progs.length?`<div class="note-box" style="margin-top:14px"><b>검토 유리 제도</b> — ${esc(s.hint)}<div class="row wrap" style="gap:6px;margin-top:8px">${s.progs.map(p=>`<button class="chip chip-info" style="cursor:pointer;border:none" onclick="location.hash='#/${PROG_MAP[p].center.toLowerCase()}/${p}'">${esc(PROG_MAP[p].short||p)} →</button>`).join('')}</div></div>`:''}
   <div class="xs" style="margin-top:12px">출처: 통계청 한국표준산업분류 제11차 개정 해설서 · <a href="${KSIC_META.official}" target="_blank" rel="noopener" style="color:var(--navy);font-weight:700">통계분류포털</a></div>
  </div>`;
}

 $('#adBody').innerHTML=`
  <div class="row wrap" style="margin-bottom:12px;gap:6px">${Object.entries(CENTERS).map(([k,v])=>`<button class="btn ${_adCenter===k?'btn-pri':'btn-line'} btn-sm" onclick="_adCenter='${k}';_adProg=PROGRAMS.find(p=>p.center==='${k}').id;_adEdit=null;ROUTES.admin()">${esc(v)}</button>`).join('')}</div>
  <div class="row wrap" style="margin-bottom:14px;gap:6px">${PROGRAMS.filter(p=>p.center===_adCenter).map(p=>`<button class="btn ${_adProg===p.id?'btn-sec':'btn-line'} btn-sm" onclick="_adProg='${p.id}';_adEdit=null;ROUTES.admin()">${esc(p.short)}</button>`).join('')}</div>
  <div id="adProgBody"></div>`;
 const p=PROG_MAP[_adProg];
 const rules=DB.workingRules().filter(r=>r.program===_adProg);
 $('#adProgBody').innerHTML=`
  <div class="card" style="margin-bottom:14px"><table class="tbl"><tbody>
   <tr><td class="xs" style="width:120px">이름</td><td><b>${esc(p.name)}</b> <span class="tag">${p.id}</span></td></tr>
   <tr><td class="xs">소관·기관</td><td>${esc(p.authority)}</td></tr>
   <tr><td class="xs">유형(Track)</td><td>${p.tracks?p.tracks.map(t=>esc(t.name)).join(' · '):'없음'}</td></tr>
   <tr><td class="xs">설명</td><td class="small">${esc(p.desc)}</td></tr></tbody></table></div>
  <div class="card" style="padding:8px 18px">
  <table class="tbl"><thead><tr><th>구분</th><th>유형</th><th>항목</th><th>출처</th><th>상태</th><th></th></tr></thead><tbody>
  ${rules.map(r=>`<tr>
   <td><span class="tag">${CLS_LABEL[r.cls]}</span></td>
   <td class="xs">${r.track?trackName(_adProg,r.track):'공통'}</td>
   <td><b>${esc(r.name)}</b>${Store.data.dirty_rules.includes(r.id)?' <span class="chip chip-warn">발행 대기</span>':''}<div class="xs">${esc(r.explain||'')}</div></td>
   <td class="xs">${r.source?.type==='INTERNAL'?'내부':'공식'}${r.source?.name?'<br>'+esc(r.source.name):'<br><span style="color:var(--danger)">출처 없음</span>'}</td>
   <td>${chip(r.status==='VERIFIED'?'pos':r.status==='RETIRED'?'neutral':'warn',RULE_STATUS_LABEL[r.status])}</td>
   <td style="text-align:right;white-space:nowrap">
    <button class="btn btn-txt btn-sm" onclick="_adEdit='${r.id}';ROUTES.admin()">수정</button>
    ${r.status==='DRAFT'&&r.source?.type==='OFFICIAL'?`<button class="btn btn-txt btn-sm" onclick="verifyRule('${r.id}')">검증 완료</button>`:''}
   </td></tr>`).join('')}</tbody></table></div>
  <div class="xs" style="margin-top:8px">INTERNAL Rule은 신청자격(Eligibility) 판정에 쓰이지 않아요. DRAFT 기본요건 FAIL은 미충족을 확정하지 않고 '추가 확인 필요'까지만 낮춰요.</div>
  <div id="adRuleEdit"></div>`;
 if(_adEdit)adRuleForm(_adEdit);
}
function adRuleForm(id){
 const r=DB.workingRules().find(x=>x.id===id); if(!r)return;
 $('#adRuleEdit').innerHTML=`<div class="card major" style="margin-top:14px">
  <h3>Rule 수정 — ${esc(r.name)}</h3>
  <div class="q"><label class="q-t">항목명</label><input id="rfName" value="${esc(r.name)}"></div>
  <div class="q"><label class="q-t">설명</label><input id="rfExp" value="${esc(r.explain||'')}"></div>
  <div class="grid2">
   <div class="q"><label class="q-t">분류</label><select id="rfCls">${Object.entries(CLS_LABEL).map(([k,v])=>`<option value="${k}" ${r.cls===k?'selected':''}>${v}</option>`).join('')}</select></div>
   <div class="q"><label class="q-t">기준 상태</label><select id="rfStatus">${Object.entries(RULE_STATUS_LABEL).map(([k,v])=>`<option value="${k}" ${r.status===k?'selected':''}>${v}</option>`).join('')}</select></div>
  </div>
  <div class="grid2">
   <div class="q"><label class="q-t">출처 유형</label><select id="rfSrcType"><option value="OFFICIAL" ${r.source?.type==='OFFICIAL'?'selected':''}>공식(OFFICIAL)</option><option value="INTERNAL" ${r.source?.type==='INTERNAL'?'selected':''}>내부(INTERNAL)</option></select></div>
   <div class="q"><label class="q-t">출처 명칭</label><input id="rfSrcName" value="${esc(r.source?.name||'')}"></div>
  </div>
  <div class="note-box"><b>영향 미리보기</b><div id="rfPreview" class="small" style="margin-top:6px"></div></div>
  <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn btn-sec" onclick="_adEdit=null;ROUTES.admin()">취소</button>
  <button class="btn btn-pri" onclick="saveRule('${id}')" data-tip="작업본에만 저장 · 발행 전에는 진단에 반영되지 않아요">저장 (발행 대기)</button></div>
  <div class="xs" style="margin-top:8px">저장은 작업본(working)에만 반영돼요. 실제 진단은 발행(Publish) 후 바뀌어요.</div>
 </div>`;
 previewRule(id);
 ['rfClsStatus'].forEach(()=>{});
 $('#rfStatus').addEventListener('change',()=>previewRule(id));
 $('#rfSrcType').addEventListener('change',()=>previewRule(id));
}
function previewRule(id){
 const st=$('#rfStatus').value, srcType=$('#rfSrcType').value, cls=$('#rfCls').value;
 const msgs=[];
 if(cls==='INTERNAL'){}
 if(srcType==='INTERNAL'&&cls==='ELIGIBILITY')msgs.push('내부 출처 + 기본요건 조합은 신청자격 판정에서 제외돼요. READINESS 사용을 권장해요.');
 if(st==='VERIFIED'&&srcType==='OFFICIAL'&&cls==='ELIGIBILITY')msgs.push('검증 완료 + 공식 + 기본요건: 이 Rule의 FAIL은 "현재 대상 아님"을 만들 수 있어요.');
 if(st==='DRAFT')msgs.push('검증 전 상태에서는 FAIL이어도 "추가 확인 필요"까지만 낮아져요.');
 if(st==='RETIRED')msgs.push('과거 기준으로 처리되어 진단에서 제외돼요.');
 $('#rfPreview').innerHTML=msgs.length?msgs.map(m=>'· '+esc(m)).join('<br>'):'특이 영향 없음';
}
function saveRule(id){
 const r=DB.workingRules().find(x=>x.id===id);
 const before=JSON.stringify({name:r.name,cls:r.cls,status:r.status,source:r.source});
 r.name=$('#rfName').value.trim()||r.name; r.explain=$('#rfExp').value.trim();
 r.cls=$('#rfCls').value; r.status=$('#rfStatus').value;
 r.source={...(r.source||{}),type:$('#rfSrcType').value,name:$('#rfSrcName').value.trim()};
 if(!Store.data.dirty_rules.includes(id))Store.data.dirty_rules.push(id);
 Store.save(); DB.audit('Rule 수정',progName(r.program)+' · '+r.name,before,JSON.stringify({name:r.name,cls:r.cls,status:r.status,source:r.source}),'');
 _adEdit=null; ROUTES.admin(); toast('작업본에 저장했어요. 발행하면 진단에 반영돼요.');
}
function verifyRule(id){
 const r=DB.workingRules().find(x=>x.id===id);
 if(!r.source?.name)return toast('출처를 먼저 입력해야 검증할 수 있어요.');
 r.status='VERIFIED'; r.source.verified=true; r.source.verified_at=todayStr();
 if(!Store.data.dirty_rules.includes(id))Store.data.dirty_rules.push(id);
 Store.save(); DB.audit('Rule 검증',progName(r.program)+' · '+r.name,'DRAFT','VERIFIED','');
 ROUTES.admin(); toast('검증 완료로 표시했어요. 발행 후 진단에 반영돼요.');
}
/* ── Ruleset 발행 ── */
function adRulesets(){
 const dirty=Store.data.dirty_rules;
 $('#adBody').innerHTML=`
  <div class="card major" style="margin-bottom:16px">
   <h3>새 기준 발행 (Publish)</h3>
   <p class="small muted">작업본의 변경 ${dirty.length}건을 새 Ruleset으로 발행하면, 이후 진단부터 새 기준이 적용돼요. 과거 진단은 당시 기준으로 보존돼요.</p>
   ${dirty.length?`<div class="card flat" style="background:var(--neutral-weak);border:none;margin:10px 0">
    ${dirty.map(id=>{const r=DB.workingRules().find(x=>x.id===id);return r?`<div class="small" style="padding:3px 0">· ${esc(progName(r.program))} — ${esc(r.name)} (${RULE_STATUS_LABEL[r.status]})</div>`:'';}).join('')}</div>
    <div class="q"><label class="q-t">발행 명칭</label><input id="rsName" value="${todayStr()} 기준 개정"></div>
    <div class="q"><label class="q-t">비고</label><input id="rsNote" placeholder="변경 요약"></div>
    <button class="btn btn-pri" onclick="publishRuleset()" data-tip="변경한 기준을 새 Ruleset으로 발행 · 이후 진단부터 적용">발행</button>`
    :'<div class="empty small">발행 대기 중인 변경이 없어요.</div>'}
  </div>
  <div class="sec-title">발행 이력</div>
  <div class="card" style="padding:8px 18px"><table class="tbl"><thead><tr><th>버전</th><th>명칭</th><th>발행일</th><th>상태</th></tr></thead><tbody>
  ${Store.data.rulesets.slice().reverse().map(rs=>`<tr><td>v${rs.version}</td><td><b>${esc(rs.name)}</b><div class="xs">${esc(rs.note||'')}</div></td><td class="xs">${dot(rs.published_at)}</td><td>${rs.id===Store.data.active_ruleset?chip('pos','활성'):chip('neutral','과거')}</td></tr>`).join('')}</tbody></table></div>`;
}
function publishRuleset(){
 const name=$('#rsName').value.trim()||todayStr()+' 기준';
 const note=$('#rsNote').value.trim();
 const ver=Math.max(...Store.data.rulesets.map(r=>r.version))+1;
 const rs={id:uid(),name,version:ver,status:'PUBLISHED',published_at:nowIso(),published_by:App.user.name,note};
 Store.data.rulesets.push(rs); Store.data.active_ruleset=rs.id;
 Store.data.published_rules=JSON.parse(JSON.stringify(Store.data.working_rules));
 const cnt=Store.data.dirty_rules.length; Store.data.dirty_rules=[];
 Store.save(); DB.audit('Ruleset 발행',name+' (v'+ver+')','',cnt+'건 반영','');
 syncTop(); ROUTES.admin(); toast('발행했어요. 이후 진단부터 새 기준이 적용돼요.');
}
/* ── 감사 로그 ── */
function adAudit(){
 const logs=Store.data.audit;
 $('#adBody').innerHTML=`<div class="card" style="padding:8px 18px"><table class="tbl"><thead><tr><th>시각</th><th>수행자</th><th>작업</th><th>대상</th><th>변경</th><th>사유</th></tr></thead><tbody>
  ${logs.length?logs.map(l=>`<tr><td class="xs">${dot(l.at)} ${l.at.slice(11,16)}</td><td class="xs">${esc(l.who)}</td><td>${esc(l.action)}</td><td class="xs">${esc(l.target)}</td>
   <td class="xs">${l.before||l.after?esc((l.before||'-').slice(0,24))+' → '+esc((l.after||'-').slice(0,24)):'-'}</td><td class="xs">${esc(l.reason||'-')}</td></tr>`).join(''):'<tr><td colspan="6" class="empty small">감사 로그가 없어요.</td></tr>'}</tbody></table></div>`;
}
/* ── 시스템 ── */
function adSystem(){
 $('#adBody').innerHTML=`<div class="card"><table class="tbl"><tbody>
  <tr><td class="xs" style="width:160px">앱 버전</td><td>${CONFIG.APP_VERSION}</td></tr>
  <tr><td class="xs">동작 모드</td><td>${CONFIG.MODE} ${CONFIG.MODE==='LIVE'&&!CONFIG.LIVE_READY?'(운영 연결 미구성 — 차단됨)':''}</td></tr>
  <tr><td class="xs">활성 기준</td><td>${esc(DB.activeRuleset()?.name)} · v${DB.activeRuleset()?.version}</td></tr>
  <tr><td class="xs">등록 기업</td><td>${DB.companies().length}개</td></tr>
  <tr><td class="xs">누적 진단</td><td>${Store.data.diagnoses.length}건</td></tr>
  <tr><td class="xs">전체 Rule</td><td>${DB.workingRules().length}개 (검증 ${DB.workingRules().filter(r=>r.status==='VERIFIED').length} · 검증 전 ${DB.workingRules().filter(r=>r.status==='DRAFT').length})</td></tr>
  </tbody></table>
  <div class="note-box" style="margin-top:14px"><b>LIVE 전환 전 필수</b><br>Supabase 연결·인증(Auth)·행 수준 보안(RLS)·정책자금 세부기준 공식 검증이 완료되어야 운영 모드를 켤 수 있어요. 미구성 상태에서 LIVE는 자동 차단돼요.</div>
  <div class="row" style="margin-top:14px"><button class="btn btn-line" onclick="App.resetDemo()">${ic('swap',15)} 데모 데이터 초기화</button></div></div>`;
}

</script>
<script>
const App={
 user:DEMO_USERS[0],
 toggleWho(e){ e.stopPropagation(); const p=$('#whoPop'); p.classList.toggle('open');
  p.innerHTML=DEMO_USERS.map(u=>`<button onclick="App.switchUser('${u.id}')">${u.id===App.user.id?ic('check',15):'<span style="width:15px"></span>'} ${esc(u.name)} <small class="xs">${esc(u.roleName)}</small></button>`).join('')
  +`<button onclick="App.resetDemo()">${ic('swap',15)} 데모 초기화</button>`; },
 switchUser(id){ App.user=DEMO_USERS.find(u=>u.id===id); $('#whoPop').classList.remove('open'); syncTop(); route(); toast(App.user.roleName+' 화면으로 전환했어요.'); },
 resetDemo(){ if(confirm('데모 데이터를 초기화할까요?')){ Store.reset(); route(); toast('데모 데이터를 초기화했어요.'); } }
};
document.addEventListener('click',()=>$('#whoPop')?.classList.remove('open'));
function syncTop(){
 const c=DB.current();
 $('#curCo').innerHTML=c?`<b>${esc(c.name)}</b><small>${esc(IND_LABEL[c.facts.industry]||'')} · 업력 ${yearsFrom(c.facts.founded)??'-'}년 · 직원 ${fmt(c.facts.employees)}명</small>`:'<b>기업 선택</b>';
 $('#whoName').textContent=App.user.name; $('#whoRole').textContent=App.user.roleName;
 $('#navAdmin').style.display=App.user.role==='ADMIN'?'flex':'none';
 $('#modeNote').textContent=CONFIG.MODE==='DEMO'?'DEMO 모드 · 기준 '+(DB.activeRuleset()?.name||'-'):'LIVE';
}
const toast=(m)=>{const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2400);};
let _modalPrevFocus=null;
function openModal(html){ const box=$('#modalBox'); box.innerHTML=html;
 box.setAttribute('role','dialog'); box.setAttribute('aria-modal','true');
 $('#modalBg').classList.add('open'); _modalPrevFocus=document.activeElement;
 const f=box.querySelector('button,select,input,textarea,a[href]'); if(f)setTimeout(()=>f.focus(),30); }
function closeModal(){ $('#modalBg').classList.remove('open');
 if(_modalPrevFocus&&_modalPrevFocus.focus){try{_modalPrevFocus.focus();}catch(e){}} _modalPrevFocus=null; }
/* 현재 기업 선택 모달 (지시서 5) */
function pickCompany(){
 openModal(`<h3>현재 기업 선택</h3>
  <div style="max-height:50vh;overflow:auto">${DB.companies().map(c=>`
   <div class="list-row click" onclick="App2.chooseCo('${c.id}')"><div><b>${esc(c.name)}</b>
    <div class="xs">${esc(IND_LABEL[c.facts.industry]||'')} · 업력 ${yearsFrom(c.facts.founded)??'-'}년</div></div>${DB.current()?.id===c.id?chip('info','현재'):ic('chevR',15)}</div>`).join('')}</div>
  <div class="row" style="justify-content:space-between;margin-top:14px"><button class="btn btn-sec" onclick="closeModal();location.hash='#/companies'">새 기업 등록</button><button class="btn btn-txt" onclick="closeModal()">닫기</button></div>`);
}
const App2={ chooseCo(id){ DB.setCurrent(id); closeModal(); syncTop(); route(); toast(orgName(id)+' 선택됨'); } };
function assertLive(){ if(CONFIG.MODE==='LIVE'&&!CONFIG.LIVE_READY){ document.body.innerHTML='<div style="display:flex;height:100vh;align-items:center;justify-content:center;flex-direction:column;gap:10px;font-family:Pretendard,sans-serif"><b style="font-size:20px">운영 연결을 사용할 수 없습니다.</b><p style="color:#6B7684">인증·권한 구성이 필요합니다. 구성 전에는 DEMO 모드만 사용할 수 있어요.</p></div>'; throw new Error('LIVE blocked'); } }
function boot(){
 assertLive(); Store.load();
 $('#modalBg').addEventListener('click',e=>{ if(e.target.id==='modalBg')closeModal(); });
 syncTop(); route();
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);
else boot();

/* a11y-global-keys: 키보드 조작 */
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){ const bg=$('#modalBg'); if(bg&&bg.classList.contains('open')){ closeModal(); return; } const side=$('#side'); if(side&&side.classList.contains('open'))side.classList.remove('open'); }
 if((e.key==='Enter'||e.key===' ')){ const el=document.activeElement; if(el&&el.getAttribute&&el.getAttribute('role')==='button'&&el.tagName.toLowerCase()!=='button'){ e.preventDefault(); el.click(); } }
});

</script>
<script>document.querySelectorAll('[data-ic]').forEach(el=>{el.outerHTML=ic(el.dataset.ic,17);});</script>
</body>
</html>
