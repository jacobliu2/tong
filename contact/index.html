<script>
(function(){
  var f=document.getElementById('tongForm'), msg=document.getElementById('formMsg'),
      btn=f.querySelector('.submit');
  f.addEventListener('submit', function(e){
    e.preventDefault();
    if(!f.checkValidity()){ f.reportValidity(); return; }
    msg.className='msg'; msg.textContent='';
    btn.disabled=true; var orig=btn.textContent; btn.textContent='전송 중…';
    fetch('https://api.web3forms.com/submit',{method:'POST',body:new FormData(f)})
      .then(function(r){return r.json();})
      .then(function(d){
        if(d.success){
          msg.className='msg ok'; msg.textContent='문의가 정상적으로 전송되었습니다. 빠르게 답변드리겠습니다.';
          f.reset();
        } else {
          msg.className='msg err'; msg.textContent=(d.message||'전송에 실패했습니다.')+' 잠시 후 다시 시도해 주세요.';
        }
      })
      .catch(function(){ msg.className='msg err'; msg.textContent='네트워크 오류로 전송하지 못했습니다. 잠시 후 다시 시도해 주세요.'; })
      .finally(function(){ btn.disabled=false; btn.textContent=orig; });
  });
})();
</script>
<script>(function(){try{var q=new URLSearchParams(location.search);if(q.get('doc')==='intro'){var b=document.getElementById('doc-banner');if(b)b.style.display='block';var sel=document.querySelector('select[name="type"],select[name="문의유형"],#inquiry-type');if(sel){for(var i=0;i<sel.options.length;i++){if(/소개서|자료|문의/.test(sel.options[i].text)){sel.selectedIndex=i;break;}}}var ta=document.querySelector('textarea');if(ta&&!ta.value){ta.value='[회사소개서 요청]\n회사명: \n관심 분야(진단·자문·동행·AX 등): \n';}var t=document.querySelector('h1,.contact-title');}}catch(e){}})();</script></body></html>
