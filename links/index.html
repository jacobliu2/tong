<style>
:root{
  --scene:url("../assets/chaekgado/hub_scene.webp");
  --amb:url("../assets/chaekgado/hub_ambient.webp");
  --ivory:#f3ece2; --ivory-2:#e7dccc; --paper:#fbf7f0; --wood:#8a6236; --wood-d:#5d3f21;
  --ink:#161d29; --navy:#1b2740; --blue:#3684FF; --bronze:#a9803f;
  --ratio:1672 / 941;
  --ease:cubic-bezier(.22,.7,.3,1);
}
*{box-sizing:border-box}
html,body{height:100%}
html{background:var(--ivory)}
body{
  margin:0;
  font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,
    'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  word-break:keep-all; -webkit-font-smoothing:antialiased;
  color:var(--ink);
  display:flex; align-items:center; justify-content:center;
  overflow:hidden;
}
/* 정본 장면 자체를 흐려 펼친 주변광 — 새 이미지를 만들지 않는다 */
body::before{
  content:"";position:fixed;inset:0;z-index:-2;
  background:var(--amb) center/cover no-repeat;
  filter:blur(46px) saturate(1.3) brightness(1.07);
  transform:scale(1.16);
}
body::after{
  content:"";position:fixed;inset:0;z-index:-1;
  background:radial-gradient(115% 85% at 50% 46%,
    rgba(255,252,247,.16) 0%, rgba(243,236,226,.62) 58%, rgba(219,205,186,.88) 100%);
}
.sr-only{
  position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0;
}
a:focus-visible,button:focus-visible{outline:none}

/* ── 건너뛰기 링크: 키보드 포커스 때만 보인다 ── */
.skip{
  position:fixed;left:12px;top:12px;z-index:300;
  padding:9px 14px;border-radius:10px;background:var(--navy);color:#fff;
  font-size:14px;font-weight:600;text-decoration:none;
  transform:translateY(-160%);transition:transform .16s ease;
}
.skip:focus-visible{transform:none;outline:2px solid var(--blue);outline-offset:2px}

/* ── Desktop: 정본 책가도 무대 ─────────────────────── */
.stage{
  position:relative;
  width:min(100vw, calc(100dvh * (1672 / 941)), 2304px);
  aspect-ratio:var(--ratio);
  isolation:isolate;
  box-shadow:
    0 0 0 1px rgba(120,92,58,.20),
    0 0 0 clamp(6px,1.1vw,14px) rgba(255,253,249,.50),
    0 40px 96px -44px rgba(52,34,14,.58);
}
.scene{
  position:absolute;inset:0;width:100%;height:100%;
  display:block;object-fit:fill;user-select:none;-webkit-user-drag:none;z-index:0;
}
/* 사물 하나 = .o (무대 전체를 덮지만 클릭은 .hit만 받는다) */
.o{
  position:absolute;inset:0;display:block;pointer-events:none;text-decoration:none;
  background:none;border:0;padding:0;margin:0;font:inherit;color:inherit;z-index:10;
}
.o::before,.o::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  opacity:0;transition:opacity .19s ease;
}
.o::before{                        /* 은은한 TONG Blue 후광 */
  z-index:1;mix-blend-mode:screen;filter:blur(2px);
  background:radial-gradient(ellipse var(--hx) var(--hy) at var(--cx) var(--cy),
    rgba(54,132,255,.30) 0,rgba(54,132,255,.13) 46%,transparent 74%);
}
.o::after{                         /* 정본 픽셀 그대로의 강조 레이어 */
  z-index:2;
  background:var(--scene) 0 0/100% 100% no-repeat;
  -webkit-mask:radial-gradient(ellipse var(--rx) var(--ry) at var(--cx) var(--cy),#000 0,#000 72%,transparent 100%) 0 0/100% 100% no-repeat;
          mask:radial-gradient(ellipse var(--rx) var(--ry) at var(--cx) var(--cy),#000 0,#000 72%,transparent 100%) 0 0/100% 100% no-repeat;
  transform-origin:var(--cx) var(--cy);
  transition:opacity .19s ease,transform .21s var(--ease),filter .19s ease;
}
.o:hover,.o:focus-visible,.o.is-on{z-index:40}
.o:hover::before,.o:focus-visible::before,.o.is-on::before{opacity:1}
.o:hover::after,.o:focus-visible::after,.o.is-on::after{
  opacity:1;transform:scale(1.025);filter:brightness(1.07) saturate(1.05) contrast(1.02);
}
.hit{
  position:absolute;left:var(--l);top:var(--t);width:var(--w);height:var(--h);
  pointer-events:auto;cursor:pointer;z-index:3;border-radius:6px;
}
.o:focus-visible .hit{outline:2px solid rgba(54,132,255,.95);outline-offset:3px;box-shadow:0 0 0 5px rgba(255,255,255,.55)}

/* ── 툴팁 (하나를 공유, 무대 안으로 위치 보정) ── */
.tip{
  position:absolute;left:0;top:0;z-index:100;max-width:300px;
  padding:8px 12px 9px;border-radius:10px;
  background:rgba(22,33,56,.94);color:#fff;
  box-shadow:0 8px 22px -8px rgba(16,26,45,.6);
  opacity:0;pointer-events:none;transform:translateY(3px);
  transition:opacity .16s ease,transform .18s var(--ease);
}
.tip.on{opacity:1;transform:none}
.tip b{display:block;font-size:13.5px;font-weight:700;letter-spacing:-.01em;line-height:1.3}
.tip span{display:block;margin-top:2px;font-size:12px;font-weight:450;line-height:1.4;color:rgba(255,255,255,.82)}
.tip em{display:block;margin-top:5px;font-style:normal;font-size:11px;font-weight:600;color:#9cc2ff}

/* ── 하위 메뉴 (화면 밖으로 나가지 않게 JS가 위치 보정) ── */
.sub{
  position:fixed;z-index:200;width:min(292px, calc(100vw - 20px));overflow:auto;
  background:var(--paper);color:var(--ink);
  border:1px solid rgba(120,92,58,.22);border-radius:14px;
  box-shadow:0 22px 48px -18px rgba(40,26,10,.55),0 0 0 4px rgba(255,253,249,.45);
  padding:6px;
}
.sub[hidden]{display:none}
.sub-h{display:flex;align-items:center;justify-content:space-between;padding:8px 8px 6px 12px;border-bottom:1px solid rgba(120,92,58,.14);margin-bottom:4px}
.sub-h strong{font-size:14px;font-weight:750;letter-spacing:-.01em;color:var(--navy)}
.sub-x{
  width:30px;height:30px;border:0;border-radius:8px;background:transparent;cursor:pointer;
  font-size:20px;line-height:1;color:#6b5a44;
}
.sub-x:hover,.sub-x:focus-visible{background:rgba(54,132,255,.10);color:var(--blue)}
.sub ul{list-style:none;margin:0;padding:0}
.sub a{
  position:relative;display:block;padding:9px 30px 9px 12px;border-radius:9px;
  text-decoration:none;color:inherit;min-height:44px;
}
.sub a b{display:block;font-size:14px;font-weight:650;line-height:1.35}
.sub a span{display:block;font-size:12px;color:#6b6457;line-height:1.4;margin-top:1px}
.sub a .ext{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-style:normal;color:#8d8170;font-size:13px}
.sub a:hover,.sub a:focus-visible{background:rgba(54,132,255,.09)}
.sub a:hover b,.sub a:focus-visible b{color:var(--blue)}
.sub a:focus-visible{box-shadow:inset 0 0 0 2px var(--blue)}

/* ── 전체 메뉴 목록: 평소 숨김 · 건너뛰기(:target) 또는 이미지 실패 시 표시 ── */
.idx{display:none}
.idx:target,.hub-noimg .idx{
  display:block;position:fixed;inset:0;z-index:250;overflow:auto;
  background:rgba(243,236,226,.97);padding:clamp(20px,5vw,56px);
}
.hub-noimg .idx{position:static;min-height:100%}
.hub-noimg body{display:block;overflow:auto}
.hub-noimg .stage,.hub-noimg .scrollhub,.hub-noimg .more{display:none!important}
.idx-in{max-width:760px;margin:0 auto}
.idx h1{font-size:22px;font-weight:800;color:var(--navy);margin:0 0 4px}
.idx .idx-lead{margin:0 0 22px;color:#5d5547;font-size:14px}
.idx-close{display:inline-block;margin-bottom:18px;color:var(--blue);font-weight:600;font-size:14px}
.hub-noimg .idx-close{display:none}
.idx > .idx-in > ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px 18px}
.idx li a{display:block;padding:8px 0;color:var(--ink);font-weight:600;text-decoration:none;border-bottom:1px solid rgba(120,92,58,.15);min-height:40px}
.idx li a:hover,.idx li a:focus-visible{color:var(--blue)}
.idx li a:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.idx .idx-h{margin:8px 0 0;font-size:12px;font-weight:700;color:var(--bronze);letter-spacing:.02em}
.idx ul ul{list-style:none;margin:0;padding:0}

/* ── Mobile: 족자 원안 이미지 + 링크 오버레이 + 더 둘러보기 ── */
.scrollhub,.more{display:none}

@media (max-width:900px), (orientation:portrait) and (max-width:1024px){
  html{background:#17110a}
  body{overflow:auto;display:block;align-items:initial;background:#17110a}
  body::before,body::after{display:none}
  .stage{display:none}
  .scrollhub{
    display:block;position:relative;margin:0 auto;
    width:min(100vw, calc(100dvh * 941 / 1672));
    aspect-ratio:941 / 1672;
  }
  .scrollhub .base{
    position:absolute;inset:0;width:100%;height:100%;
    object-fit:contain;display:block;user-select:none;-webkit-user-drag:none;
  }
  .scrollhub .hot{
    position:absolute;display:block;overflow:visible;padding:0;margin:0;border:0;background:none;cursor:pointer;
    -webkit-tap-highlight-color:transparent;text-decoration:none;
  }
  .scrollhub .hot::after{
    content:'';position:absolute;inset:4% 0;border-radius:9px;
    background:rgba(54,132,255,0);box-shadow:0 0 0 0 rgba(54,132,255,0);
    transition:background .15s ease, box-shadow .15s ease;pointer-events:none;
  }
  .scrollhub .hot:active::after,
  .scrollhub .hot:focus-visible::after,
  .scrollhub .hot[aria-expanded="true"]::after{
    background:rgba(54,132,255,.12);
    box-shadow:0 0 0 2px rgba(54,132,255,.65), 0 0 18px rgba(54,132,255,.28);
  }

  /* 족자에 없는 메뉴 — 족자 종이와 같은 결의 카드 */
  .more{
    display:block;margin:0 auto;padding:18px 14px calc(26px + env(safe-area-inset-bottom));
    width:min(100vw, 560px);
  }
  .more-card{
    background:linear-gradient(180deg,#f6efe2,#efe5d3);
    border-radius:14px;padding:18px 16px 8px;
    box-shadow:0 0 0 1px rgba(169,128,63,.35),0 18px 40px -20px rgba(0,0,0,.7);
  }
  .more h2{margin:0 0 2px;font-size:17px;font-weight:800;color:var(--navy);letter-spacing:-.01em}
  .more .more-lead{margin:0 0 10px;font-size:12.5px;color:#6b5f4c}
  .more ul{list-style:none;margin:0;padding:0}
  .more-g + .more-g{border-top:1px solid rgba(120,92,58,.18)}
  .more-h{margin:12px 0 2px;font-size:12px;font-weight:700;color:var(--bronze);letter-spacing:.02em}
  .more a{
    display:flex;flex-direction:column;justify-content:center;
    min-height:48px;padding:8px 26px 8px 2px;position:relative;
    text-decoration:none;color:var(--ink);-webkit-tap-highlight-color:rgba(54,132,255,.12);
  }
  .more a::after{content:'›';position:absolute;right:6px;top:50%;transform:translateY(-50%);color:#a08f74;font-size:18px}
  .more a b{font-size:15px;font-weight:650;line-height:1.35}
  .more a span{font-size:12px;color:#6b6457;line-height:1.4}
  .more a:active b,.more a:focus-visible b{color:var(--blue)}
  .more a:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
  .more-foot{margin:14px 0 0;text-align:center;font-size:11px;color:rgba(243,236,226,.55)}
}


/* ── 모바일 선택창 (상담·예약) ── */
.sheet{position:fixed;inset:0;z-index:260;background:rgba(18,12,6,.48);display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sheet-open body{overflow:hidden}
.sheet-box{
  width:min(100vw,560px);background:var(--paper);color:var(--ink);
  border-radius:18px 18px 0 0;padding:8px 14px calc(14px + env(safe-area-inset-bottom));
  box-shadow:0 -18px 40px -16px rgba(0,0,0,.5);animation:sheetUp .22s var(--ease);
}
@keyframes sheetUp{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;padding:10px 2px 8px;border-bottom:1px solid rgba(120,92,58,.16)}
.sheet-h strong{font-size:16px;font-weight:800;color:var(--navy)}
.sheet-x{width:40px;height:40px;border:0;border-radius:10px;background:transparent;font-size:24px;line-height:1;color:#6b5a44;cursor:pointer}
.sheet-x:focus-visible{outline:2px solid var(--blue)}
.sheet ul{list-style:none;margin:4px 0 0;padding:0}
.sheet li + li{border-top:1px solid rgba(120,92,58,.12)}
.sheet a{display:flex;flex-direction:column;justify-content:center;min-height:56px;padding:8px 26px 8px 4px;position:relative;text-decoration:none;color:var(--ink);-webkit-tap-highlight-color:rgba(54,132,255,.12)}
.sheet a::after{content:'›';position:absolute;right:8px;top:50%;transform:translateY(-50%);color:#a08f74;font-size:20px}
.sheet a b{font-size:16px;font-weight:700}
.sheet a span{font-size:12.5px;color:#6b6457}
.sheet a:focus-visible{outline:2px solid var(--blue);outline-offset:-2px;border-radius:8px}
.sheet a:active b,.sheet a:focus-visible b{color:var(--blue)}

@media (prefers-reduced-motion:reduce){
  .o::after,.tip,.skip{transition-duration:.01ms}
  .o:hover::after,.o:focus-visible::after,.o.is-on::after{transform:none}
  .scrollhub .hot::after{transition:none}
  .sheet-box{animation:none}
}
</style>
</head>
