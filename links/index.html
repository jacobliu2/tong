*{box-sizing:border-box}

/* 정본 장면 자체를 흐려 펼친 주변광 — 새 이미지를 만들지 않는다 */
body::before{
  content:"";position:fixed;inset:0;z-index:-2;
  background:var(--amb) center/cover no-repeat;
  filter:blur(46px) saturate(1.3) brightness(1.07);
  transform:scale(1.16);
}
body::after{
  content:"";position:fixed;inset:0;z-index:-1;
  background:
    radial-gradient(115% 85% at 50% 46%,
      rgba(255,252,247,.16) 0%,
      rgba(243,236,226,.62) 58%,
      rgba(219,205,186,.88) 100%);
}
.sr-only{
  position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0;
}
a:focus-visible{outline:none}

/* ── Desktop: 정본 책가도 무대 ───────────────────────── */
.stage{
  position:relative;
  width:min(100vw, calc(100dvh * (1536 / 680)), 2304px);
  aspect-ratio:var(--ratio);
  isolation:isolate;
  box-shadow:
    0 0 0 1px rgba(120,92,58,.20),
    0 0 0 clamp(6px,1.1vw,14px) rgba(255,253,249,.50),
    0 40px 96px -44px rgba(52,34,14,.58);
}
.scene{
  position:absolute;inset:0;width:100%;height:100%;
  display:block;object-fit:fill;user-select:none;-webkit-user-drag:none;z-index:0;
}

.o{position:absolute;inset:0;display:block;pointer-events:none;text-decoration:none}
.o::before,.o::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  opacity:0;transition:opacity .19s ease;
}
.o::before{                       /* TONG Blue halo */
  z-index:1;mix-blend-mode:screen;filter:blur(2px);
}
.o::after{                        /* 정본 픽셀 그대로의 강조 레이어 */
  z-index:2;
  background:var(--scene) 0 0/100% 100% no-repeat;
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
  -webkit-mask-size:100% 100%;mask-size:100% 100%;
  transform-origin:inherit;
  transition:opacity .19s ease,transform .21s var(--ease),filter .19s ease;
}
.o:hover::before,.o:focus-visible::before,.o.is-on::before{opacity:1}
.o:hover::after,.o:focus-visible::after,.o.is-on::after{
  opacity:1;transform:scale(1.035);filter:brightness(1.085) saturate(1.06) contrast(1.02);
}
.hit{
  position:absolute;left:var(--l);top:var(--t);width:var(--w);height:var(--h);
  pointer-events:auto;cursor:pointer;z-index:3;
}

/* ── Tooltip ─────────────────────────────────────────── */
.tip{
  position:absolute;left:var(--tx);top:var(--ty);z-index:100;
  padding:6px 11px;border-radius:9px;
  background:rgba(22,33,56,.94);color:#fff;
  font-size:12.5px;font-style:normal;font-weight:600;letter-spacing:-.01em;
  line-height:1.25;white-space:nowrap;
  box-shadow:0 6px 18px -6px rgba(16,26,45,.6);
  opacity:0;pointer-events:none;
  transition:opacity .16s ease,transform .18s var(--ease);
}
.tip-up .tip{transform:translate(-50%,calc(-100% - 14px))}
.tip-down .tip{transform:translate(-50%,14px)}
.o:hover .tip,.o:focus-visible .tip,.o.is-on .tip{opacity:1}
.tip-up:hover .tip,.tip-up:focus-visible .tip,.tip-up.is-on .tip{
  transform:translate(-50%,calc(-100% - 9px))}
.tip-down:hover .tip,.tip-down:focus-visible .tip,.tip-down.is-on .tip{
  transform:translate(-50%,9px)}
.o:focus-visible .hit{
  outline:2px solid rgba(54,132,255,.9);outline-offset:2px;border-radius:6px;
}

/* ── Mobile: 세로형 통이미지 + 오버레이 ─────────────────
   PC .stage는 그대로 두고, 모바일에서만 단일 통이미지(00_mobile_base_scene)를
   깔고 그 위에 오브젝트 실루엣을 1:1로 겹쳐 TONG Blue halo로 강조한다.
   라벨은 통이미지에 이미 인쇄되어 있어 hover 없이 항상 보인다. */
.vstage{display:none}

@media (max-width:900px), (orientation:portrait) and (max-width:1024px){
  body{overflow:auto;display:block;align-items:initial;background:#e9e3d8}
  .stage{display:none}
  .vstage{
    display:block;position:relative;
    width:min(100vw,540px);
    aspect-ratio:1080 / 1920;
    margin:0 auto;
    overflow:hidden;
    box-shadow:0 24px 70px -30px rgba(45,31,17,.35);
  }
  .vstage .mbase{
    position:absolute;inset:0;width:100%;height:100%;display:block;
    object-fit:cover;user-select:none;-webkit-user-drag:none;z-index:0;
  }
  .vstage .tap{
    position:absolute;display:block;outline:0;text-decoration:none;z-index:1;
    -webkit-tap-highlight-color:transparent;touch-action:manipulation;
  }
  .vstage .hi{
    position:absolute;left:0;top:0;width:100%;height:auto;
    display:block;-webkit-user-drag:none;user-select:none;pointer-events:none;
    opacity:0;transform:scale(1);transform-origin:50% 60%;
    transition:opacity .12s ease,transform .16s ease,filter .16s ease;
    filter:brightness(1.12) saturate(1.08) drop-shadow(0 0 12px rgba(54,132,255,.8));
  }
  .vstage .tap:active .hi,
  .vstage .tap.active .hi,
  .vstage .tap:focus-visible .hi{opacity:1;transform:scale(1.045)}
  .vstage .tap:focus-visible{outline:2px solid #3684ff;outline-offset:3px;border-radius:8px}
}

@media (prefers-reduced-motion:reduce){
  .o::after,.tip{transition-duration:.01ms}
  .o:hover::after,.o:focus-visible::after,.o.is-on::after{transform:none}
  .vstage .hi{transition-duration:.01ms}
  .vstage .tap:active .hi,.vstage .tap.active .hi{transform:none}
}

    var disarm = function () {
      if (armed) armed.classList.remove('is-on');
      armed = null; clearTimeout(timer);
    };
    var arm = function (el) {
      disarm(); armed = el; el.classList.add('is-on');
      timer = setTimeout(disarm, 2800);
    };
    document.addEventListener('click', function (e) {
      var a = e.target.closest('a.o');
      if (!a) { disarm(); return; }
      if (a !== armed) { e.preventDefault(); arm(a); }
      else { disarm(); }
    }, true);
    document.addEventListener('scroll', disarm, {passive: true});
  }

  /* 모바일(.tap): 한 번 터치 = 즉시 이동, touchstart 순간 해당 오브젝트만 halo */
  document.querySelectorAll('.vstage .tap').forEach(function (a) {
    a.addEventListener('touchstart', function () { a.classList.add('active'); }, {passive: true});
    a.addEventListener('touchend', function () { setTimeout(function () { a.classList.remove('active'); }, 160); }, {passive: true});
    a.addEventListener('touchcancel', function () { a.classList.remove('active'); }, {passive: true});
  });
})();
</script>
